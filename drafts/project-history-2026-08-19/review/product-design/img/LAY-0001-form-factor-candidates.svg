<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Leshy2 G3 physical layout candidates</title>
  <desc id="desc">Three same-scope handheld product candidates showing user surfaces, RF zones, battery, service and M5 expansion placement. Dimensions are working envelopes and the drawing is not to scale.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #4b5563; }
      .candidate { font-size: 22px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 600; }
      .small { font-size: 12px; fill: #374151; }
      .micro { font-size: 10px; fill: #374151; }
      .body { fill: #f8fafc; stroke: #334155; stroke-width: 3; }
      .outline { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; }
      .rf { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .display { fill: #1f2937; stroke: #0f172a; stroke-width: 2; }
      .displayText { fill: #f8fafc; font-size: 13px; font-weight: 600; }
      .control { fill: #e5e7eb; stroke: #475569; stroke-width: 2; }
      .safety { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .expansion { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .power { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .service { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .audio { fill: #ffedd5; stroke: #ea580c; stroke-width: 2; }
      .divider { stroke: #cbd5e1; stroke-width: 1; }
      .risk { fill: #fff7ed; stroke: #f97316; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#ffffff"/>
  <text x="55" y="48" class="title">Leshy2 G3 — first physical layout candidates</text>
  <text x="55" y="76" class="subtitle">Same reviewed functions in all three · zones only, no selected electronics or pins · working envelopes, not to scale</text>

  <g transform="translate(55,96)">
    <rect x="0" y="0" width="26" height="16" class="rf"/><text x="34" y="13" class="small">RF / antenna clearance</text>
    <rect x="190" y="0" width="26" height="16" class="power"/><text x="224" y="13" class="small">battery / power</text>
    <rect x="355" y="0" width="26" height="16" class="service"/><text x="389" y="13" class="small">compute / service volume</text>
    <rect x="585" y="0" width="26" height="16" class="expansion"/><text x="619" y="13" class="small">M5 Cap / Unit</text>
    <rect x="755" y="0" width="26" height="16" class="audio"/><text x="789" y="13" class="small">audio</text>
    <rect x="855" y="0" width="26" height="16" class="safety"/><text x="889" y="13" class="small">STOP / RE-ARM / PTT</text>
  </g>

  <line x1="535" y1="135" x2="535" y2="1015" class="divider"/>
  <line x1="1065" y1="135" x2="1065" y2="1015" class="divider"/>

  <!-- P1 -->
  <g>
    <text x="55" y="155" class="candidate">P1 · Compact wide</text>
    <text x="55" y="178" class="subtitle">105 × 86 × 27–31 mm · aggressive lower bound</text>

    <rect x="105" y="195" width="330" height="60" rx="8" class="outline"/>
    <text x="270" y="218" text-anchor="middle" class="label">rear U214 dock · 84 mm</text>
    <text x="270" y="238" text-anchor="middle" class="small">Cap partly behind body</text>

    <rect x="120" y="225" width="300" height="366" rx="30" class="body"/>
    <path d="M145 247 H395 V310 H145 Z" class="rf"/>
    <text x="270" y="270" text-anchor="middle" class="label">compact RF head</text>
    <text x="270" y="291" text-anchor="middle" class="small">3×nRF sectors internal</text>
    <circle cx="175" cy="243" r="10" class="rf"/><circle cx="270" cy="238" r="10" class="rf"/><circle cx="365" cy="243" r="10" class="rf"/>
    <rect x="165" y="330" width="210" height="128" rx="8" class="display"/>
    <text x="270" y="387" text-anchor="middle" class="displayText">2.4–2.8″ window</text>
    <text x="270" y="408" text-anchor="middle" class="displayText">status / capture / menus</text>

    <circle cx="218" cy="510" r="38" class="control"/>
    <path d="M218 482 V538 M190 510 H246" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <circle cx="318" cy="510" r="20" class="control"/><text x="318" y="515" text-anchor="middle" class="small">OK</text>
    <rect x="285" y="548" width="72" height="24" rx="8" class="control"/><text x="321" y="565" text-anchor="middle" class="micro">BACK · MENU</text>

    <rect x="402" y="360" width="40" height="72" rx="10" class="safety"/>
    <text x="422" y="390" text-anchor="middle" class="small" transform="rotate(90 422 390)">STOP</text>
    <rect x="98" y="380" width="34" height="74" rx="10" class="safety"/>
    <text x="115" y="416" text-anchor="middle" class="small" transform="rotate(-90 115 416)">PTT</text>
    <circle cx="389" cy="556" r="11" class="safety"/><text x="389" y="580" text-anchor="middle" class="micro">RE-ARM</text>
    <rect x="215" y="575" width="110" height="20" rx="5" class="expansion"/>
    <text x="270" y="589" text-anchor="middle" class="micro">1× selectable Unit</text>
    <circle cx="150" cy="570" r="8" fill="none" stroke="#475569" stroke-width="2"/><text x="164" y="574" class="micro">tether</text>

    <text x="55" y="635" class="label">Internal zoning / rear cutaway</text>
    <rect x="75" y="654" width="420" height="255" rx="18" class="body"/>
    <rect x="92" y="672" width="386" height="48" rx="8" class="rf"/>
    <text x="285" y="700" text-anchor="middle" class="label">RF head · crowded isolation volume</text>
    <rect x="92" y="734" width="250" height="68" rx="8" class="service"/>
    <text x="217" y="763" text-anchor="middle" class="label">compute + direct service hatch</text>
    <text x="217" y="783" text-anchor="middle" class="small">selected chips later</text>
    <rect x="355" y="734" width="123" height="68" rx="8" class="audio"/>
    <text x="416" y="764" text-anchor="middle" class="label">audio</text>
    <rect x="92" y="816" width="250" height="70" rx="8" class="power"/>
    <text x="217" y="856" text-anchor="middle" class="label">compact battery</text>
    <rect x="355" y="816" width="123" height="70" rx="8" class="expansion"/>
    <text x="416" y="847" text-anchor="middle" class="label">Cap / Unit</text>
    <text x="416" y="866" text-anchor="middle" class="small">power &amp; strain</text>
    <rect x="75" y="928" width="420" height="58" rx="10" class="risk"/>
    <text x="285" y="951" text-anchor="middle" class="label">Main risk: RF/service/connector density</text>
    <text x="285" y="972" text-anchor="middle" class="small">smallest only if complete G4 fit proves no loss</text>
  </g>

  <!-- P2 -->
  <g>
    <text x="575" y="155" class="candidate">P2 · Balanced portrait</text>
    <text x="575" y="178" class="subtitle">125 × 86 × 29–34 mm · current recommendation</text>

    <rect x="620" y="190" width="360" height="62" rx="8" class="outline"/>
    <text x="800" y="214" text-anchor="middle" class="label">full rear U214 rail · downstream Port A clear</text>
    <text x="800" y="235" text-anchor="middle" class="small">keyed retention + antenna bend envelope</text>

    <rect x="660" y="220" width="280" height="407" rx="30" class="body"/>
    <rect x="682" y="242" width="236" height="76" rx="12" class="rf"/>
    <text x="800" y="270" text-anchor="middle" class="label">separated RF head</text>
    <text x="800" y="291" text-anchor="middle" class="small">nRF sectors + other RF clearances</text>
    <circle cx="710" cy="238" r="10" class="rf"/><circle cx="800" cy="234" r="10" class="rf"/><circle cx="890" cy="238" r="10" class="rf"/>

    <rect x="695" y="338" width="210" height="160" rx="8" class="display"/>
    <text x="800" y="407" text-anchor="middle" class="displayText">2.8–3.2″ window</text>
    <text x="800" y="429" text-anchor="middle" class="displayText">touch candidate + local keys</text>
    <circle cx="735" cy="550" r="34" class="control"/>
    <path d="M735 526 V574 M711 550 H759" stroke="#475569" stroke-width="7" stroke-linecap="round"/>
    <circle cx="840" cy="545" r="28" class="control"/><text x="840" y="550" text-anchor="middle" class="small">ENC</text>
    <rect x="805" y="584" width="92" height="24" rx="8" class="control"/>
    <text x="851" y="601" text-anchor="middle" class="micro">BACK · HOME</text>
    <rect x="925" y="355" width="40" height="78" rx="10" class="safety"/>
    <text x="945" y="390" text-anchor="middle" class="small" transform="rotate(90 945 390)">STOP</text>
    <rect x="635" y="375" width="38" height="82" rx="10" class="safety"/>
    <text x="654" y="416" text-anchor="middle" class="small" transform="rotate(-90 654 416)">PTT</text>
    <circle cx="912" cy="590" r="11" class="safety"/><text x="912" y="613" text-anchor="middle" class="micro">RE-ARM</text>
    <rect x="676" y="605" width="88" height="22" rx="5" class="expansion"/>
    <rect x="775" y="605" width="88" height="22" rx="5" class="expansion"/>
    <text x="720" y="620" text-anchor="middle" class="micro">Unit 1</text>
    <text x="819" y="620" text-anchor="middle" class="micro">Unit 2</text>

    <text x="575" y="665" class="label">Internal zoning / rear cutaway</text>
    <rect x="595" y="684" width="440" height="250" rx="18" class="body"/>
    <rect x="614" y="702" width="402" height="52" rx="8" class="rf"/>
    <text x="815" y="733" text-anchor="middle" class="label">RF head · deliberate body/Cap separation</text>
    <rect x="614" y="768" width="270" height="65" rx="8" class="service"/>
    <text x="749" y="796" text-anchor="middle" class="label">compute + dedicated service hatch</text>
    <text x="749" y="816" text-anchor="middle" class="small">direct recovery per selected chip</text>
    <rect x="897" y="768" width="119" height="65" rx="8" class="audio"/>
    <text x="956" y="805" text-anchor="middle" class="label">audio</text>
    <rect x="614" y="847" width="270" height="68" rx="8" class="power"/>
    <text x="749" y="886" text-anchor="middle" class="label">medium battery + thermal margin</text>
    <rect x="897" y="847" width="119" height="68" rx="8" class="expansion"/>
    <text x="956" y="876" text-anchor="middle" class="label">rear rail</text>
    <text x="956" y="896" text-anchor="middle" class="small">Cap / IMU</text>
    <rect x="595" y="951" width="440" height="58" rx="10" class="risk"/>
    <text x="815" y="974" text-anchor="middle" class="label">Hypothesis: best pocketability / RF / service trade</text>
    <text x="815" y="995" text-anchor="middle" class="small">must survive complete electronics and cost candidates</text>
  </g>

  <!-- P3 -->
  <g>
    <text x="1090" y="155" class="candidate">P3 · Field-service chassis</text>
    <text x="1090" y="178" class="subtitle">148 × 88 × 34–40 mm · feasibility upper bound</text>

    <rect x="1128" y="182" width="360" height="66" rx="8" class="outline"/>
    <text x="1308" y="208" text-anchor="middle" class="label">recessed U214 bay · 84 mm</text>
    <text x="1308" y="230" text-anchor="middle" class="small">Cap inside rear silhouette</text>

    <rect x="1170" y="212" width="276" height="464" rx="30" class="body"/>
    <rect x="1186" y="232" width="244" height="94" rx="12" class="rf"/>
    <text x="1308" y="262" text-anchor="middle" class="label">replaceable RF head volume</text>
    <text x="1308" y="284" text-anchor="middle" class="small">maximum separation &amp; fixture access</text>
    <text x="1308" y="305" text-anchor="middle" class="micro">same radios — no extra product scope</text>
    <circle cx="1210" cy="224" r="11" class="rf"/><circle cx="1308" cy="220" r="11" class="rf"/><circle cx="1406" cy="224" r="11" class="rf"/>

    <rect x="1202" y="348" width="212" height="184" rx="8" class="display"/>
    <text x="1308" y="430" text-anchor="middle" class="displayText">3.2–3.5″ window</text>
    <text x="1308" y="452" text-anchor="middle" class="displayText">glove-first field UI</text>
    <circle cx="1244" cy="586" r="38" class="control"/>
    <path d="M1244 558 V614 M1216 586 H1272" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1352" cy="579" r="31" class="control"/><text x="1352" y="584" text-anchor="middle" class="small">ENC</text>
    <rect x="1318" y="626" width="98" height="26" rx="8" class="control"/>
    <text x="1367" y="644" text-anchor="middle" class="micro">BACK · HOME</text>
    <rect x="1433" y="360" width="42" height="86" rx="10" class="safety"/>
    <text x="1454" y="402" text-anchor="middle" class="small" transform="rotate(90 1454 402)">STOP</text>
    <rect x="1144" y="385" width="40" height="90" rx="10" class="safety"/>
    <text x="1164" y="430" text-anchor="middle" class="small" transform="rotate(-90 1164 430)">PTT</text>
    <circle cx="1418" cy="646" r="11" class="safety"/><text x="1418" y="670" text-anchor="middle" class="micro">RE-ARM</text>
    <rect x="1190" y="654" width="96" height="22" rx="5" class="expansion"/>
    <rect x="1296" y="654" width="96" height="22" rx="5" class="expansion"/>
    <text x="1238" y="669" text-anchor="middle" class="micro">Unit 1</text>
    <text x="1344" y="669" text-anchor="middle" class="micro">Unit 2</text>

    <text x="1090" y="710" class="label">Internal zoning / rear cutaway</text>
    <rect x="1110" y="729" width="440" height="250" rx="18" class="body"/>
    <rect x="1129" y="747" width="402" height="56" rx="8" class="rf"/>
    <text x="1330" y="780" text-anchor="middle" class="label">serviceable RF head · largest isolation volume</text>
    <rect x="1129" y="817" width="235" height="65" rx="8" class="service"/>
    <text x="1246" y="845" text-anchor="middle" class="label">compute bay</text>
    <text x="1246" y="866" text-anchor="middle" class="small">board partition later</text>
    <rect x="1377" y="817" width="154" height="65" rx="8" class="service"/>
    <text x="1454" y="844" text-anchor="middle" class="label">service spine</text>
    <text x="1454" y="865" text-anchor="middle" class="small">direct debug/recovery</text>
    <rect x="1129" y="895" width="235" height="65" rx="8" class="power"/>
    <text x="1246" y="933" text-anchor="middle" class="label">largest battery / thermal margin</text>
    <rect x="1377" y="895" width="154" height="65" rx="8" class="expansion"/>
    <text x="1454" y="924" text-anchor="middle" class="label">Cap / Unit bay</text>
    <text x="1454" y="944" text-anchor="middle" class="small">protected cable route</text>
    <rect x="1110" y="996" width="440" height="42" rx="10" class="risk"/>
    <text x="1330" y="1022" text-anchor="middle" class="label">Main cost: size, mass and enclosure complexity</text>
  </g>
</svg>
