name: Critical CAD library

on:
  push:
    paths:
      - "hardware/kicad/**"
      - ".github/workflows/cad-library.yml"
  pull_request:
    paths:
      - "hardware/kicad/**"
      - ".github/workflows/cad-library.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate critical compute symbols and footprints
        run: python3 hardware/kicad/tools/validate_compute_libraries.py
