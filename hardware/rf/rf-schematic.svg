<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <style>
    :root{ color-scheme: light dark; }
    .bg{fill:#ffffff}
    .box{fill:#f2f6f7;stroke:#4a5b62;stroke-width:1.6}
    .lora{fill:#e1f5ee;stroke:#0f8f84;stroke-width:1.8}
    .bus{stroke:#4a5b62;stroke-width:3;fill:none}
    .wire{stroke:#4a5b62;stroke-width:1.4;fill:none}
    .tap{fill:#4a5b62}
    .ant{stroke:#8a9aa0;stroke-width:1.6;fill:none}
    .t{fill:#152220;font-size:13px;font-weight:700;text-anchor:middle}
    .s{fill:#5c6f6c;font-size:10.5px;text-anchor:middle}
    .sl{fill:#5c6f6c;font-size:10.5px;text-anchor:start}
    .buslbl{fill:#0f8f84;font-size:12px;font-weight:700}
    .cs{fill:#0c447c;font-size:10.5px;font-weight:700;text-anchor:middle}
    .band{fill:#0f8f84;font-size:11px;text-anchor:middle}
    .title{fill:#152220;font-size:16px;font-weight:700}
    .sub{fill:#5c6f6c;font-size:11.5px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1518}
      .box{fill:#17262b;stroke:#33505a}
      .lora{fill:#04342c;stroke:#2bb3a6}
      .bus{stroke:#5b6f77}.wire{stroke:#33505a}.tap{fill:#5b6f77}.ant{stroke:#90a6ab}
      .t{fill:#e7eff0}.s{fill:#90a6ab}.sl{fill:#90a6ab}.buslbl{fill:#2bb3a6}.cs{fill:#8fc0f0}.band{fill:#2bb3a6}
      .title{fill:#e7eff0}.sub{fill:#90a6ab}
    }
  </style>
  <rect class="bg" x="0" y="0" width="1180" height="470"/>
  <text class="title" x="28" y="30">Leshy2 — Sheet 3 · RF chains (SPI data radios)</text>
  <text class="sub" x="28" y="50">Shared SPI (SCK 23 · MOSI 24 · MISO 6) · one CS at a time from the 74HC138 · separate antenna per chain</text>

  <!-- modules: centers 140 340 540 760 980 -->
  <!-- nRF24 x3 -->
  <g>
    <text class="band" x="140" y="86">2.4 GHz</text>
    <path class="ant" d="M140 95 V132 M140 95 l-9 -10 M140 95 l9 -10"/>
    <rect class="box" x="60" y="140" width="160" height="86" rx="7"/>
    <text class="t" x="140" y="166">nRF24 #1</text><text class="s" x="140" y="184">+PA/LNA · u.FL</text><text class="s" x="140" y="201">CSN Y2 · CE 26</text><text class="s" x="140" y="218">IRQ polled</text>
    <path class="wire" d="M140 226 V300"/><circle class="tap" cx="140" cy="300" r="4"/><text class="cs" x="140" y="292">Y2</text>
  </g>
  <g>
    <text class="band" x="340" y="86">2.4 GHz</text>
    <path class="ant" d="M340 95 V132 M340 95 l-9 -10 M340 95 l9 -10"/>
    <rect class="box" x="260" y="140" width="160" height="86" rx="7"/>
    <text class="t" x="340" y="166">nRF24 #2</text><text class="s" x="340" y="184">+PA/LNA · u.FL</text><text class="s" x="340" y="201">CSN Y3 · CE 26</text><text class="s" x="340" y="218">IRQ polled</text>
    <path class="wire" d="M340 226 V300"/><circle class="tap" cx="340" cy="300" r="4"/><text class="cs" x="340" y="292">Y3</text>
  </g>
  <g>
    <text class="band" x="540" y="86">2.4 GHz</text>
    <path class="ant" d="M540 95 V132 M540 95 l-9 -10 M540 95 l9 -10"/>
    <rect class="box" x="460" y="140" width="160" height="86" rx="7"/>
    <text class="t" x="540" y="166">nRF24 #3</text><text class="s" x="540" y="184">+PA/LNA · u.FL</text><text class="s" x="540" y="201">CSN Y4 · CE 26</text><text class="s" x="540" y="218">IRQ polled</text>
    <path class="wire" d="M540 226 V300"/><circle class="tap" cx="540" cy="300" r="4"/><text class="cs" x="540" y="292">Y4</text>
  </g>
  <!-- CC1101 -->
  <g>
    <text class="band" x="760" y="86">300–928</text>
    <path class="ant" d="M760 95 V132 M760 95 l-9 -10 M760 95 l9 -10"/>
    <rect class="box" x="680" y="140" width="160" height="86" rx="7"/>
    <text class="t" x="760" y="166">CC1101</text><text class="s" x="760" y="184">E07-900M · u.FL</text><text class="s" x="760" y="201">CS Y1 · GDO0 8</text><text class="s" x="760" y="218">opt. 1-SMA switch</text>
    <path class="wire" d="M760 226 V300"/><circle class="tap" cx="760" cy="300" r="4"/><text class="cs" x="760" y="292">Y1</text>
  </g>
  <!-- SX1262 -->
  <g>
    <text class="band" x="980" y="86">868 / 915</text>
    <path class="ant" d="M980 95 V132 M980 95 l-9 -10 M980 95 l9 -10"/>
    <rect class="lora" x="900" y="140" width="160" height="86" rx="7"/>
    <text class="t" x="980" y="166">SX1262 (LoRa)</text><text class="s" x="980" y="184">E22-900M22S +22dBm</text><text class="s" x="980" y="201">NSS Y5 · BUSY 9</text><text class="s" x="980" y="218">DIO1 poll · NRESET exp</text>
    <path class="wire" d="M980 226 V300"/><circle class="tap" cx="980" cy="300" r="4"/><text class="cs" x="980" y="292">Y5</text>
  </g>

  <!-- SPI bus -->
  <line class="bus" x1="40" y1="300" x2="1140" y2="300"/>
  <circle class="tap" cx="40" cy="300" r="4"/>
  <text class="buslbl" x="48" y="292">SPI</text>
  <text class="sl" x="48" y="320">SCK 23 · MOSI 24 · MISO 6 · CS from 74HC138 (Sheet 2) — one device selected at a time</text>

  <rect class="box" x="40" y="352" width="1100" height="96" rx="9"/>
  <text class="t" x="590" y="376">Power &amp; antennas</text>
  <text class="sl" x="58" y="398">nRF24 brownout (mandatory): 100–220 µF + 100 nF at each VCC · CC1101 / SX1262 PA: local 47–100 µF bulk · all on +3V3</text>
  <text class="sl" x="58" y="418">5 of 8 onboard antennas here: 3× 2.4 GHz · 1 sub-GHz · 1 LoRa — u.FL → top SMA, separate per chain, no shared RF switch</text>
  <text class="sl" x="58" y="438">Si4732 (HF/CB/FM) and SA868 (UHF voice) are audio radios → Sheet 4, not here</text>
</svg>
