<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <style>
    .bg{fill:#ffffff}
    .ink{fill:#1c1c1c}
    .box{fill:#f5f7f8;stroke:#33414a;stroke-width:1.6}
    .ic{fill:#eef3f5;stroke:#20323a;stroke-width:1.8}
    .w{stroke:#33414a;stroke-width:1.6;fill:none}
    .t{fill:#1c1c1c;font-size:13px;font-weight:700}
    .s{fill:#5a6b72;font-size:11px}
    .ref{fill:#0f8f84;font-size:11px;font-weight:700}
    .vsys{stroke:#6b7280;stroke-width:3;fill:none}
    .r5{stroke:#b26a12;stroke-width:3;fill:none}
    .r33{stroke:#1f6fb0;stroke-width:3;fill:none}
    .r33a{stroke:#0f8f84;stroke-width:3;fill:none}
    .r5t{fill:#b26a12;font-size:12px;font-weight:700}
    .r33t{fill:#1f6fb0;font-size:12px;font-weight:700}
    .r33at{fill:#0f8f84;font-size:12px;font-weight:700}
    .note{fill:#b23b32;font-size:11px}
    .coil{stroke:#33414a;stroke-width:1.8;fill:none}
  </style>
  <rect class="bg" x="0" y="0" width="1180" height="660"/>
  <text class="t" x="30" y="34" font-size="16">Leshy2 · Sheet 1 — Power</text>
  <text class="s" x="30" y="52">2S 18650 · USB-C PD · power-path · +5V / +3V3 / +3V3A</text>

  <!-- J1 USB-C -->
  <rect class="box" x="30" y="90" width="105" height="96" rx="6"/>
  <text class="ref" x="40" y="110">J1</text>
  <text class="t" x="40" y="128">USB-C</text>
  <text class="s" x="40" y="146">VBUS · CC1/2</text>
  <text class="s" x="40" y="162">ESD array</text>
  <line class="w" x1="135" y1="120" x2="330" y2="120"/><!-- VBUS -->
  <text class="s" x="150" y="114">VBUS</text>
  <line class="w" x1="135" y1="150" x2="185" y2="150"/><!-- CC1 -->
  <line class="w" x1="135" y1="166" x2="185" y2="166"/><!-- CC2 -->

  <!-- U1 CH224K sits on CC lines -->
  <rect class="ic" x="185" y="132" width="105" height="58" rx="6"/>
  <text class="ref" x="194" y="150">U1</text>
  <text class="t" x="194" y="167">CH224K</text>
  <text class="s" x="194" y="183">PD → 12V req</text>
  <line class="w" x1="240" y1="132" x2="240" y2="120"/><!-- U1 senses VBUS -->

  <!-- U2 BQ25887 -->
  <rect class="ic" x="330" y="92" width="180" height="150" rx="7"/>
  <text class="ref" x="342" y="112">U2</text>
  <text class="t" x="342" y="130">BQ25887</text>
  <text class="s" x="342" y="148">2S charger, I²C</text>
  <text class="s" x="342" y="164">cell balance</text>
  <text class="s" x="342" y="180">power-path</text>
  <text class="s" x="342" y="210">TS ← NTC</text>
  <text class="s" x="342" y="228">SDA/SCL/INT → C5</text>
  <line class="w" x1="510" y1="128" x2="560" y2="128"/><!-- SW -->
  <text class="s" x="512" y="122">SW</text>
  <line class="w" x1="510" y1="176" x2="560" y2="176"/><!-- SYS -->
  <text class="s" x="512" y="170">SYS</text>

  <!-- L1 to VSYS -->
  <path class="coil" d="M513 128 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0"/>
  <text class="s" x="512" y="112">L1 2.2µH</text>

  <!-- battery + protection -->
  <rect class="box" x="330" y="330" width="200" height="96" rx="6"/>
  <text class="ref" x="342" y="352">BT1</text>
  <text class="t" x="342" y="370">2S · 2×18650</text>
  <text class="s" x="342" y="386">≈7.4 V · 18 Wh</text>
  <text class="s" x="342" y="404">U3 S-8254A + Q1</text>
  <text class="s" x="342" y="420">F1 PPTC · RT1 NTC</text>
  <line class="w" x1="380" y1="330" x2="380" y2="242"/><!-- BAT+ to U2 -->
  <text class="s" x="386" y="300">BAT</text>
  <line class="w" x1="440" y1="330" x2="440" y2="242"/><!-- mid tap -->
  <text class="s" x="446" y="320">BATM</text>

  <!-- VSYS bus -->
  <line class="vsys" x1="560" y1="128" x2="560" y2="300"/>
  <line class="w" x1="545" y1="176" x2="560" y2="176"/>
  <text class="vsys" x="566" y="124" fill="#6b7280" font-size="12" font-weight="700">VSYS 6.0–8.4V</text>

  <!-- U4 MP2315 +5V -->
  <rect class="ic" x="610" y="128" width="150" height="70" rx="6"/>
  <text class="ref" x="620" y="147">U4</text>
  <text class="t" x="620" y="164">MP2315</text>
  <text class="s" x="620" y="181">+5V / 3A buck</text>
  <line class="w" x1="560" y1="150" x2="610" y2="150"/><!-- IN from VSYS -->
  <line class="w" x1="760" y1="150" x2="792" y2="150"/><!-- SW out -->
  <path class="coil" d="M793 150 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0"/>
  <text class="s" x="793" y="138">L2 4.7µH</text>
  <text class="s" x="620" y="212">FB: R1 52.3k / R2 10k → 4.98V</text>

  <!-- U5 TLV62569 +3V3 -->
  <rect class="ic" x="610" y="258" width="150" height="70" rx="6"/>
  <text class="ref" x="620" y="277">U5</text>
  <text class="t" x="620" y="294">TLV62569</text>
  <text class="s" x="620" y="311">+3V3 / 2A buck</text>
  <line class="w" x1="560" y1="280" x2="610" y2="280"/>
  <line class="w" x1="760" y1="280" x2="792" y2="280"/>
  <path class="coil" d="M793 280 a8 8 0 0 1 16 0 a8 8 0 0 1 16 0"/>
  <text class="s" x="793" y="268">L3 2.2µH</text>
  <text class="s" x="620" y="342">FB: R3 45.3k / R4 10k → 3.32V</text>
  <line class="w" x1="560" y1="280" x2="560" y2="300"/>

  <!-- +5V rail -->
  <line class="r5" x1="825" y1="150" x2="1000" y2="150"/>
  <text class="r5t" x="828" y="142">+5V</text>
  <!-- +3V3 rail -->
  <line class="r33" x1="825" y1="280" x2="1000" y2="280"/>
  <text class="r33t" x="828" y="272">+3V3</text>

  <!-- U6 LDO fed from +5V, makes +3V3A -->
  <line class="r5" x1="900" y1="150" x2="900" y2="392"/>
  <rect class="ic" x="835" y="392" width="150" height="62" rx="6"/>
  <text class="ref" x="845" y="411">U6</text>
  <text class="t" x="845" y="428">TPS7A2033</text>
  <text class="s" x="845" y="444">+3V3A LDO (LN)</text>
  <line class="w" x1="900" y1="392" x2="900" y2="392"/>
  <line class="w" x1="985" y1="423" x2="1000" y2="423"/>
  <line class="r33a" x1="1000" y1="423" x2="1055" y2="423"/>
  <text class="r33at" x="1002" y="415">+3V3A</text>

  <!-- load boxes -->
  <rect class="box" x="1005" y="108" width="170" height="86" rx="6"/>
  <text class="r5t" x="1015" y="126">+5V loads</text>
  <text class="s" x="1015" y="143">SA868 PA · onboard LoRa</text>
  <text class="s" x="1015" y="159">WS2812 · PAM8302</text>
  <text class="s" x="1015" y="175">Grove 5V</text>
  <line class="r5" x1="1000" y1="150" x2="1005" y2="150"/>

  <rect class="box" x="1005" y="238" width="170" height="100" rx="6"/>
  <text class="r33t" x="1015" y="256">+3V3 loads</text>
  <text class="s" x="1015" y="273">ESP32-C5 · CC1101</text>
  <text class="s" x="1015" y="289">3× nRF24* · microSD</text>
  <text class="s" x="1015" y="305">TFT · sensors</text>
  <text class="note" x="1015" y="325">* 100–220µF+100nF @VCC</text>

  <rect class="box" x="1060" y="398" width="115" height="56" rx="6"/>
  <text class="r33at" x="1070" y="416">+3V3A</text>
  <text class="s" x="1070" y="433">Si4732</text>
  <text class="s" x="1070" y="448">SA868 audio</text>

  <!-- GND rail -->
  <line class="w" x1="30" y1="560" x2="1000" y2="560" stroke-width="2"/>
  <text class="s" x="30" y="552">GND</text>
  <g stroke="#33414a" stroke-width="1.6">
    <line x1="82" y1="186" x2="82" y2="560"/>
    <line x1="430" y1="426" x2="430" y2="560"/>
    <line x1="685" y1="198" x2="685" y2="560"/>
    <line x1="685" y1="328" x2="685" y2="560"/>
    <line x1="910" y1="454" x2="910" y2="560"/>
  </g>

  <text class="s" x="30" y="600">Refs map 1:1 to power.md. Values are datasheet starting points — confirm at bring-up.</text>
  <text class="s" x="30" y="618">Charging needs PD 9–12V (2S buck can't reach 8.4V from plain 5V); device still runs from battery on 5V-only.</text>
</svg>
