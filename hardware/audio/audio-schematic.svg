<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <style>
    :root{ color-scheme: light dark; }
    .bg{fill:#ffffff}
    .box{fill:#f2f6f7;stroke:#4a5b62;stroke-width:1.6}
    .amp{fill:#e6f1fb;stroke:#0c447c;stroke-width:1.8}
    .wire{stroke:#4a5b62;stroke-width:1.4;fill:none}
    .audio{stroke:#a4670f;stroke-width:1.8;fill:none;stroke-dasharray:6 3}
    .ant{stroke:#8a9aa0;stroke-width:1.6;fill:none}
    .t{fill:#152220;font-size:13px;font-weight:700;text-anchor:middle}
    .s{fill:#5c6f6c;font-size:10.5px;text-anchor:middle}
    .sl{fill:#5c6f6c;font-size:10.5px;text-anchor:start}
    .au{fill:#a4670f;font-size:10.5px;font-weight:700}
    .band{fill:#0f8f84;font-size:10.5px;text-anchor:middle}
    .title{fill:#152220;font-size:16px;font-weight:700}
    .sub{fill:#5c6f6c;font-size:11.5px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1518}
      .box{fill:#17262b;stroke:#33505a}.amp{fill:#042c53;stroke:#5b9bd8}
      .wire{stroke:#33505a}.audio{stroke:#f4ab3d}.ant{stroke:#90a6ab}
      .t{fill:#e7eff0}.s{fill:#90a6ab}.sl{fill:#90a6ab}.au{fill:#f4ab3d}.band{fill:#2bb3a6}
      .title{fill:#e7eff0}.sub{fill:#90a6ab}
    }
  </style>
  <defs><marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a4670f"/></marker></defs>
  <rect class="bg" x="0" y="0" width="1120" height="500"/>
  <text class="title" x="28" y="30">Leshy2 — Sheet 4 · Audio (fully analog, no DAC)</text>
  <text class="sub" x="28" y="50">Si4732 (I²C) &amp; SA868 (UART) line-outs → 2:1 analog mux → PAM8302 class-D → speaker · MCU not in the path</text>

  <!-- Si4732 -->
  <text class="band" x="60" y="112">HF whip</text>
  <path class="ant" d="M60 118 V150 M53 142 h14 M53 134 h14 M53 126 h14"/>
  <path class="wire" d="M60 150 H90"/>
  <rect class="box" x="90" y="120" width="210" height="96" rx="7"/>
  <text class="t" x="195" y="146">Si4732</text>
  <text class="s" x="195" y="164">HF/CB/FM RX · +3V3A</text>
  <text class="s" x="195" y="182">I²C SDA0/SCL1 · RST→exp</text>
  <text class="s" x="195" y="200">RCLK 32.768 kHz</text>

  <!-- SA868 -->
  <text class="band" x="60" y="312">UHF</text>
  <path class="ant" d="M60 320 V352 M60 320 l-9 -10 M60 320 l9 -10"/>
  <path class="wire" d="M60 352 H90"/>
  <rect class="box" x="90" y="320" width="210" height="96" rx="7"/>
  <text class="t" x="195" y="346">SA868-U</text>
  <text class="s" x="195" y="364">433/446 voice · +5V PA</text>
  <text class="s" x="195" y="382">UART TX11/RX15</text>
  <text class="s" x="195" y="400">PTT/PD → exp</text>

  <!-- mic -->
  <rect class="box" x="90" y="440" width="210" height="46" rx="7"/>
  <text class="t" x="195" y="463">electret mic</text>
  <text class="s" x="195" y="479">+ 1 µF (fast TX fade-in)</text>
  <path class="audio" d="M195 440 V416" marker-end="url(#aa)"/>
  <text class="au" x="205" y="432" >MIC</text>

  <!-- mux -->
  <rect class="box" x="440" y="210" width="130" height="120" rx="7"/>
  <text class="t" x="505" y="258">2:1 mux</text>
  <text class="s" x="505" y="276">74LVC1G3157</text>
  <text class="s" x="505" y="294">sel → PCA9555</text>
  <path class="audio" d="M300 168 H400 V240 H440" marker-end="url(#aa)"/>
  <text class="au" x="330" y="160">Si4732 L+R line-out</text>
  <path class="audio" d="M300 368 H400 V300 H440" marker-end="url(#aa)"/>
  <text class="au" x="330" y="388">SA868 AF-out (RX)</text>

  <!-- PAM8302 -->
  <rect class="amp" x="650" y="222" width="170" height="96" rx="7"/>
  <text class="t" x="735" y="256">PAM8302A</text>
  <text class="s" x="735" y="274">class-D · +5V</text>
  <text class="s" x="735" y="292">SD → PCA9555</text>
  <path class="audio" d="M570 270 H650" marker-end="url(#aa)"/>

  <!-- speaker -->
  <path class="audio" d="M820 270 H880" marker-end="url(#aa)"/>
  <path class="wire" d="M888 244 v52 l26 20 v-92 z"/>
  <text class="s" x="905" y="332">LS1 4–8 Ω · BTL</text>

  <rect class="box" x="440" y="392" width="470" height="90" rx="9"/>
  <text class="t" x="675" y="416">Notes</text>
  <text class="sl" x="458" y="437">Volume set in-radio (Si4732 I²C reg / SA868 UART) — no analog pot; PAM8302 gain fixed by R.</text>
  <text class="sl" x="458" y="455">One source live at a time (mode-exclusive) → clean 2:1 select; assert SD while switching (no click).</text>
  <text class="sl" x="458" y="473">HF whip → AMI via match + ESD clamp · these are 2 of the 8 onboard antennas.</text>
</svg>
