<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 470" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <style>
    :root{ color-scheme: light dark; }
    .bg{fill:#ffffff}
    .box{fill:#f2f6f7;stroke:#4a5b62;stroke-width:1.6}
    .ref{fill:#f2f6f7;stroke:#9aa7ac;stroke-width:1.4;stroke-dasharray:5 3}
    .foc{fill:#e1f5ee;stroke:#0f8f84;stroke-width:1.8}
    .bus{stroke:#4a5b62;stroke-width:3;fill:none}
    .wire{stroke:#4a5b62;stroke-width:1.4;fill:none}
    .tap{fill:#4a5b62}
    .ant{stroke:#8a9aa0;stroke-width:1.6;fill:none}
    .t{fill:#152220;font-size:12.5px;font-weight:700;text-anchor:middle}
    .s{fill:#5c6f6c;font-size:10.5px;text-anchor:middle}
    .sl{fill:#5c6f6c;font-size:10.5px;text-anchor:start}
    .addr{fill:#854f0b;font-size:11px;font-weight:700;text-anchor:middle}
    .buslbl{fill:#0f8f84;font-size:12px;font-weight:700}
    .title{fill:#152220;font-size:16px;font-weight:700}
    .sub{fill:#5c6f6c;font-size:11.5px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1518}
      .box{fill:#17262b;stroke:#33505a}.ref{fill:#141e22;stroke:#5b6f77}.foc{fill:#04342c;stroke:#2bb3a6}
      .bus{stroke:#5b6f77}.wire{stroke:#33505a}.tap{fill:#5b6f77}.ant{stroke:#90a6ab}
      .t{fill:#e7eff0}.s{fill:#90a6ab}.sl{fill:#90a6ab}.addr{fill:#fac775}.buslbl{fill:#2bb3a6}
      .title{fill:#e7eff0}.sub{fill:#90a6ab}
    }
  </style>
  <rect class="bg" x="0" y="0" width="1150" height="470"/>
  <text class="title" x="28" y="30">Leshy2 — Sheet 5 · Expansion (one I²C bus)</text>
  <text class="sub" x="28" y="50">SDA 0 · SCL 1 · one pair of 4.7k pull-ups · +3V3 signals, +5V power to Grove · addressed by device, no 2nd port</text>

  <!-- pull-ups -->
  <text class="s" x="70" y="92">+3V3 · 4.7k×2</text>
  <path class="wire" d="M70 100 V150"/><circle class="tap" cx="70" cy="150" r="4"/>

  <!-- I2C bus -->
  <line class="bus" x1="70" y1="150" x2="1110" y2="150"/>
  <text class="buslbl" x="80" y="142">I²C</text>

  <!-- devices -->
  <!-- PCA9555 ref -->
  <line class="wire" x1="180" y1="150" x2="180" y2="200"/><circle class="tap" cx="180" cy="150" r="4"/>
  <rect class="ref" x="105" y="200" width="150" height="76" rx="7"/>
  <text class="t" x="180" y="226">PCA9555</text><text class="addr" x="180" y="244">0x20</text><text class="s" x="180" y="262">slow lines · Sheet 2</text>

  <!-- Si4732 ref -->
  <line class="wire" x1="360" y1="150" x2="360" y2="200"/><circle class="tap" cx="360" cy="150" r="4"/>
  <rect class="ref" x="285" y="200" width="150" height="76" rx="7"/>
  <text class="t" x="360" y="226">Si4732</text><text class="addr" x="360" y="244">0x11/0x63</text><text class="s" x="360" y="262">receiver · Sheet 4</text>

  <!-- BQ ref -->
  <line class="wire" x1="540" y1="150" x2="540" y2="200"/><circle class="tap" cx="540" cy="150" r="4"/>
  <rect class="ref" x="465" y="200" width="150" height="76" rx="7"/>
  <text class="t" x="540" y="226">BQ25887</text><text class="addr" x="540" y="244">0x6A</text><text class="s" x="540" y="262">charger · Sheet 1</text>

  <!-- u-blox GPS focus -->
  <text class="s" x="730" y="112">int. antenna</text>
  <path class="ant" d="M730 118 V150 M730 118 l-9 -10 M730 118 l9 -10"/>
  <line class="wire" x1="760" y1="150" x2="760" y2="200"/><circle class="tap" cx="760" cy="150" r="4"/>
  <rect class="foc" x="670" y="200" width="180" height="92" rx="7"/>
  <text class="t" x="760" y="226">u-blox SAM-M8Q</text><text class="addr" x="760" y="244">0x42</text><text class="s" x="760" y="262">onboard GPS · NMEA/DDC</text><text class="s" x="760" y="280">V_BCKP = supercap</text>

  <!-- Grove focus -->
  <line class="wire" x1="980" y1="150" x2="980" y2="200"/><circle class="tap" cx="980" cy="150" r="4"/>
  <rect class="foc" x="895" y="200" width="170" height="76" rx="7"/>
  <text class="t" x="980" y="224">Grove I²C · J40</text><text class="s" x="980" y="242">+5V·GND·SDA·SCL</text><text class="s" x="980" y="260">ESD · hub for several</text>
  <path class="wire" d="M980 276 V322"/><circle class="tap" cx="980" cy="322" r="3"/>
  <rect class="box" x="895" y="322" width="170" height="60" rx="7"/>
  <text class="t" x="980" y="346">M5 units (plug-in)</text><text class="s" x="980" y="364">RFID2 0x28 · sensors · RTC</text>

  <rect class="box" x="105" y="322" width="700" height="60" rx="9"/>
  <text class="sl" x="122" y="344">Address collision (e.g. two 0x28) → TCA9548A mux 0x70 · only case that needs more than the plain bus.</text>
  <text class="sl" x="122" y="364">5V power / 3.3V signals on Grove — C5 is not 5V-tolerant · one shared pull-up pair, not per unit.</text>
</svg>
