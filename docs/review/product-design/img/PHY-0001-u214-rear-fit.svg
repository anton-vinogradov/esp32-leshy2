<text x="430.0" y="316.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#172033">U214 end openings must remain accessible:</text>
<text x="430.0" y="338.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">own RP-SMA, downstream HY2.0-4P and screw access</text>
