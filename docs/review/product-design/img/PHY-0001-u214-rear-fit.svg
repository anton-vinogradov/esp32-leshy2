<text x="430.0" y="504.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Cardputer-like raised rail / recessed female header</text>
<text x="430.0" y="526.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">+ two screw bosses; not a flat PCB header</text>
