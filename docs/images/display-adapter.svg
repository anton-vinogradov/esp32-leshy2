<text x="555.0" y="549.0" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#b42318">Tail thickness/outline remains a received-display H5 fit check.</text>
<text x="40.0" y="590.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#166534">H1 result</text>
<text x="140.0" y="590.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#166534">main UI PCB bay, exact DF40 mate and 40-contact mapping are fixed without buying a display</text>
<text x="40.0" y="620.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#b42318">H5 boundary</text>
<text x="140.0" y="620.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#b42318">a received tail may revise only this small adapter and its panel-side connector</text>
