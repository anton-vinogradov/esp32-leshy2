<text x="555.0" y="390.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#172033">Selected height to panel-connector top: 3.8 mm</text>
<text x="555.0" y="413.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Available inner gap: 11.0 mm</text>
<text x="555.0" y="455.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#172033">Electrical contract</text>
<text x="555.0" y="480.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#166534">UI PIN_n ↔ adapter PIN_n ↔ panel PIN_n, n = 1…40</text>
<text x="555.0" y="503.0" font-family="sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#172033">No active device and no pin remapping on the adapter.</text>
