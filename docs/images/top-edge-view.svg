<text x="456.0" y="599.1" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#344054">base PCB · 75 mm</text>
<line x1="120.0" y1="637.1" x2="792.0" y2="637.1" stroke="#344054"/>
<line x1="120.0" y1="631.1" x2="120.0" y2="643.1" stroke="#344054"/>
<line x1="792.0" y1="631.1" x2="792.0" y2="643.1" stroke="#344054"/>
<text x="456.0" y="629.1" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#9a3412">U214 · 84 mm · symmetric 4.5-mm side overhang</text>
<text x="920.0" y="150.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#172033">What this view proves</text>
<text x="920.0" y="184.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#166534">✓ 84-mm Cap overhang is 4.5 mm on each side</text>
<text x="920.0" y="212.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#166534">✓ both antenna banks mount on opposed outward PCB faces</text>
<text x="920.0" y="240.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#166534">✓ the exact 11-mm interboard channel contains no antenna body</text>
<text x="920.0" y="268.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#166534">✓ antenna centre planes are separated by 20.55 mm</text>
<text x="920.0" y="316.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#172033">Projection limits</text>
<text x="920.0" y="350.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Display/front-bank and U214/battery overlaps are Y-collapse artifacts.</text>
<text x="920.0" y="378.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Use the adjacent external views for their real longitudinal positions.</text>
<text x="920.0" y="426.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#172033">Selected depth references</text>
<text x="920.0" y="460.0" font-family="sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#172033">M5Stack U214 Cap LoRa-1262 · 15.287 mm</text>
<text x="920.0" y="488.0" font-family="sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#172033">Keystone Electronics 1048P · 20.7-mm installed envelope</text>
<text x="920.0" y="516.0" font-family="sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#172033">HMX035CTFT-001 · 10.0 mm</text>
<text x="920.0" y="564.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#b42318">Nominal maximum selected-part depth: 44.9 mm</text>
<text x="920.0" y="590.0" font-family="sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#526076">Excludes enclosure walls, solder and manufacturing tolerances.</text>
<text x="30.0" y="690.0" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#b42318">Dimensioned architecture projection — not a production enclosure drawing.</text>
