<rect x="120.0" y="362.8" width="672.0" height="137.6" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="7 4" fill-opacity="0.45" data-instance="u214"/>
<rect x="296.8" y="362.8" width="318.4" height="186.3" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" fill-opacity="0.45" data-instance="pack-holder"/>
