<ellipse cx="552.0" cy="309.6" rx="25.4" ry="25.4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" data-path="VOICE-V/U"/>
<ellipse cx="648.0" cy="309.6" rx="25.4" ry="25.4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" data-path="N24-2"/>
</g>
<text x="790.0" y="143.2" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="start" fill="#1d4ed8">4 front ports</text>
<text x="790.0" y="156.2" font-family="sans-serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="#1d4ed8">UI outer face</text>
<text x="790.0" y="307.6" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="start" fill="#9a3412">5 rear ports</text>
<text x="790.0" y="320.6" font-family="sans-serif" font-size="8.5" font-weight="normal" text-anchor="start" fill="#9a3412">RF/power outer face</text>
<line x1="156.0" y1="507.8" x2="756.0" y2="507.8" stroke="#344054"/>
<line x1="156.0" y1="501.8" x2="156.0" y2="513.8" stroke="#344054"/>
<line x1="756.0" y1="501.8" x2="756.0" y2="513.8" stroke="#344054"/>
<text x="456.0" y="499.8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#344054">base PCB · 75 mm</text>
<line x1="120.0" y1="537.8" x2="792.0" y2="537.8" stroke="#344054"/>
<line x1="120.0" y1="531.8" x2="120.0" y2="543.8" stroke="#344054"/>
<line x1="792.0" y1="531.8" x2="792.0" y2="543.8" stroke="#344054"/>
<text x="456.0" y="529.8" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#9a3412">installed U214 worst-case · symmetric 4.5-mm side overhang</text>
<text x="920.0" y="150.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#172033">What this view proves</text>
<text x="920.0" y="184.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#166534">✓ 84-mm Cap overhang is 4.5 mm on each side</text>
<text x="920.0" y="212.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#166534">✓ both antenna banks mount on opposed outward PCB faces</text>
<text x="920.0" y="240.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#166534">✓ the exact 11-mm interboard channel contains no antenna body</text>
<text x="920.0" y="268.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#166534">✓ antenna centre planes are separated by 20.55 mm</text>
<text x="920.0" y="316.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#172033">Projection limits</text>
<text x="920.0" y="350.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Display/front-bank and installed-Cap/battery overlaps are Y-collapse artifacts.</text>
<text x="920.0" y="378.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Use the adjacent external views for their real longitudinal positions.</text>
<text x="920.0" y="420.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#172033">Y-collapsed rear envelopes</text>
<text x="920.0" y="450.0" font-family="sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#9a3412">orange dashed — U214 · 84 mm · Y=17…41</text>
<text x="920.0" y="476.0" font-family="sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#166534">green dashed — 1048P + cells · 39.8 mm · Y=42…128</text>
<text x="920.0" y="516.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#172033">Selected Z envelopes</text>
<text x="920.0" y="546.0" font-family="sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#172033">M5Stack U214 Cap LoRa-1262 · 15.287 mm</text>
<text x="920.0" y="570.0" font-family="sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#172033">Keystone Electronics 1048P · 20.7 mm installed</text>
<text x="920.0" y="594.0" font-family="sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#172033">HMX035CTFT-001 · 3.2 mm</text>
<text x="920.0" y="630.0" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#b42318">Nominal maximum selected-part depth: 38.1 mm</text>
<text x="920.0" y="654.0" font-family="sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#526076">Excludes enclosure walls, solder and manufacturing tolerances.</text>
<text x="30.0" y="690.0" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#b42318">Dimensioned architecture projection — not a production enclosure drawing.</text>
</svg>
