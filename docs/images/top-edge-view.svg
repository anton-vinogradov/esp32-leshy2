<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" data-view="top-edge" data-look-direction="antenna-edge-to-bottom" data-rf-mounting="opposed-outer-faces" data-x-scale-px-per-mm="8.0" data-z-scale-px-per-mm="8.0">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="36.0" font-family="sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#172033">Leshy2 — true top view from the antenna edge</text>
<text x="30.0" y="62.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#b42318">Looking along board +Y. Horizontal is board X; vertical is front-to-rear depth Z.</text>
<text x="30.0" y="84.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#526076">Board Y is collapsed in this orthographic projection; the rear view separately proves Cap/battery longitudinal clearance.</text>
<text x="96.0" y="150.0" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="end" fill="#1d4ed8">FRONT</text>
<text x="96.0" y="289.2" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="end" fill="#166534">REAR</text>
<rect x="238.0" y="145.0" width="436.0" height="25.6" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" data-instance="display"/>
<rect x="156.0" y="170.6" width="600.0" height="12.8" rx="1" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" data-instance="ui-pcb"/>
<rect x="156.0" y="183.4" width="600.0" height="88.0" rx="1" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" data-board-gap-mm="11" data-antenna-bodies="none"/>
<rect x="156.0" y="271.4" width="600.0" height="12.8" rx="1" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" data-instance="rf-pcb"/>
<text x="456.0" y="227.4" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#9d174d">FX8C M1 · 11-mm board gap</text>
<g id="top-edge-rear-envelopes" data-y-collapsed="true">
<rect x="120.0" y="284.2" width="672.0" height="122.3" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="7 4" fill-opacity="0.45" data-instance="u214"/>
<rect x="296.8" y="284.2" width="318.4" height="165.6" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 3" fill-opacity="0.45" data-instance="pack-holder"/>
</g>
<g id="front-antenna-bank" data-count="4" data-mount-face="ui-pcb-outer">
<ellipse cx="284.0" cy="145.2" rx="25.4" ry="25.4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" data-path="S3-2G4"/>
<ellipse cx="396.0" cy="145.2" rx="25.4" ry="25.4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" data-path="RX-FM/SW"/>
<ellipse cx="516.0" cy="145.2" rx="25.4" ry="25.4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" data-path="RX-AM/LW"/>
<ellipse cx="628.0" cy="145.2" rx="25.4" ry="25.4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" data-path="C5-2G4/5"/>
</g>
<g id="rear-antenna-bank" data-count="5" data-mount-face="rf-pcb-outer">
<ellipse cx="264.0" cy="309.6" rx="25.4" ry="25.4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" data-path="N24-0"/>
