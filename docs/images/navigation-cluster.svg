<text x="700.0" y="143.0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#172033">5× OMRON B3S-1100P · direct finger press</text>
<text x="700.0" y="169.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">UP · DOWN · LEFT · RIGHT · OK</text>
