<text x="700.0" y="294.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Cluster envelope: 24.6×24.0 mm</text>
<text x="700.0" y="320.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Button-centre pitch: 9.0 mm</text>
<text x="700.0" y="346.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">BACK/OPT clearance: 7.6 mm each</text>
<text x="700.0" y="372.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Bottom PCB margin: 5.6 mm</text>
<text x="700.0" y="414.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#172033">Quantity-100 component cost</text>
<text x="700.0" y="445.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Five selected buttons: $3.2025 per device</text>
<text x="700.0" y="471.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#526076">PCB, assembly, enclosure, freight and tax excluded</text>
<text x="30.0" y="530.0" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#b42318">Dimensioned component placement; enclosure opening feel and endurance remain H5 checks.</text>
