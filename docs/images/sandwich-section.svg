<text x="30.0" y="36.0" font-family="sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#172033">Leshy2 — two physical cross-sections</text>
<text x="30.0" y="62.0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#b42318">Each panel is one physical cut plane; zones are never combined.</text>
<text x="30.0" y="84.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#526076">Horizontal: board X. Vertical: front-to-rear depth Z. Both panels look from the antenna edge along +Y.</text>
<text x="60.0" y="118.0" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#172033">A–A · Cap-Bus dock · stock U214 worst-case</text>
