<text x="262.0" y="469.0" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#166534">UI PCB</text>
<rect x="236" y="417" width="154" height="38" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="313.0" y="440.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d4ed8">50-pin ZIF</text>
