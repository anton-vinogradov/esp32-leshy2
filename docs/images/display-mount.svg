<text x="870.0" y="92.0" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f766e">FPC enters from antenna edge</text>
<rect x="760" y="225" width="95" height="78" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<rect x="885" y="225" width="95" height="78" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<text x="807.0" y="267.0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#172033">S3</text>
<text x="932.0" y="267.0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#172033">C5</text>
<text x="870.0" y="332.0" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#166534">direct display nets</text>
<path d="M816 171 L807 225 M924 171 L932 225" stroke="#16a34a" stroke-width="2"/>
<text x="650.0" y="595.0" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#172033">Connector envelope: 27.0 × 3.8 × 1.0 mm</text>
<text x="650.0" y="618.0" font-family="sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#172033">Inner gap: 11.0 mm · removed stack: 3.8 mm · height saved: 2.8 mm</text>
<text x="650.0" y="650.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#b42318">Removed: both DF40 connectors and the separate display-adapter PCB</text>
<text x="40.0" y="680.0" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#166534">Factory operation: populate ZIF on UI PCB, install panel into shell bed, close latch, apply PSA/preload and perform visual/power-on inspection.</text>
