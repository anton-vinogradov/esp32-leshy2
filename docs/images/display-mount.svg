<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40.0" y="42.0" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#172033">Leshy2 — direct display ZIF and supported panel mount</text>
<text x="40.0" y="68.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#526076">L2-DISP-DIRECT-001-A · one connector on the UI PCB · no adapter PCB · ZIF carries no mechanical load</text>
<text x="55.0" y="112.0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d4ed8">Front-to-rear section</text>
