<rect x="107" y="183" width="311" height="139" rx="5" fill="#cfe1ff" stroke="#2563eb" stroke-width="2"/>
<text x="262.0" y="254.0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#172033">ER-TFT035IPS-6 + ER-TPC035-6</text>
