<text x="313.0" y="385.0" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#b42318">latch remains accessible after opening</text>
<text x="70.0" y="505.0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#166534">Load path</text>
<text x="70.0" y="530.0" font-family="sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#172033">bezel → panel bed/PSA → shell; corner locators stop shear; compliant pad controls rattle</text>
<text x="70.0" y="553.0" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#166534">The folded FPC has slack and strain relief. It does not retain the screen and does not peel the ZIF.</text>
