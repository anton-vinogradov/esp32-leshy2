<text x="545" y="520" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" fill="#526076">no finger contact</text>
<rect x="735" y="420" width="300" height="132" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
<text x="885" y="454" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ea580c">INDEPENDENT CAPTURE</text>
<text x="885" y="492" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#172033">4 pilot shoulders + 4 lips / PCB</text>
<text x="885" y="520" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" fill="#526076">one loose screw does not load M1</text>
<rect x="1075" y="420" width="300" height="132" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="1225" y="454" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#7c3aed">SERVICEABLE</text>
<text x="1225" y="492" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#172033">snap-retained nylon hex nut</text>
<text x="1225" y="520" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="500" text-anchor="middle" fill="#526076">0.05 N·m diagonal seating</text>
<text x="70" y="615" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1d4ed8">WHAT HOLDS WHAT</text>
<text x="90" y="660" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#7c3aed">Clamp / Z</text>
<text x="250" y="660" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172033">screw → bearing floors → PCBs → 11-mm stops → nut</text>
<text x="90" y="700" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#ea580c">Shear / X-Y</text>
<text x="250" y="700" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172033">four 2.45-mm shell pilots inside the existing 2.70-mm PCB holes</text>
<text x="90" y="740" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#059669">Separation</text>
<text x="250" y="740" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172033">four edge-lip segments retain each PCB independently</text>
<text x="90" y="780" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#dc2626">M1</text>
<text x="250" y="780" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#172033">electrical mating and alignment only · never used to pull the boards together</text>
<text x="70" y="865" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#526076">H6.0.1 remains open only for the five microcoax service loops and their enclosure/inspection clearances.</text>
<text x="70" y="908" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#166534">audit: pass · four axes match both native PCBs · no fabrication or purchase authorized</text>
