<text x="560.0" y="598.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#172033">Meaning of this view</text>
<text x="560.0" y="626.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Rear face viewed normal to the PCB — not a side section.</text>
