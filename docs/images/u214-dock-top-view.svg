<text x="560.0" y="676.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Orange: removable Cap/controls; blue: raised rail; green: batteries.</text>
<text x="560.0" y="716.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#b42318">Still requires specimen/HIL</text>
<text x="560.0" y="744.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">• STOP actuator depth, RE-ARM recess, STOP overtravel and encoder access</text>
