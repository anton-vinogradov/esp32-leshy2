<text x="560.0" y="143.0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#166534">✓ antenna bodies end at Y=6 mm; the Cap starts at Y=17 mm</text>
<text x="560.0" y="170.0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#166534">✓ U214 occupies Y=17…41 mm</text>
<text x="560.0" y="197.0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#166534">✓ battery holder occupies Y=42…128 mm</text>
<text x="560.0" y="224.0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#166534">✓ the two envelopes have a 1.0-mm plan gap</text>
<text x="560.0" y="251.0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#166534">✓ 84-mm Cap overhang is symmetric: 4.5 mm per side</text>
<text x="560.0" y="278.0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#166534">✓ 56-mm retention pitch remains inside the 75-mm base</text>
<text x="560.0" y="324.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#172033">Selected parts</text>
<text x="560.0" y="352.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#9a3412">M5Stack U214 Cap LoRa-1262</text>
<text x="560.0" y="377.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#075985">Samtec SSW-107-02-S-D · vertical 2×7 host socket</text>
<text x="560.0" y="402.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#166534">Keystone Electronics 1048P · rotated holder</text>
<text x="560.0" y="448.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#172033">Meaning of this view</text>
<text x="560.0" y="476.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Rear face viewed normal to the PCB — not a side section.</text>
<text x="560.0" y="501.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Orange: removable Cap envelope; blue: raised host rail/socket.</text>
<text x="560.0" y="526.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Green: holder and cells. Dashed orange: M2.5 keep-outs.</text>
<text x="560.0" y="566.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#b42318">Still requires specimen/HIL</text>
<text x="560.0" y="594.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">• received-U214 pin length, socket bottoming and repeated-cycle retention</text>
<text x="560.0" y="619.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">• rail height/tolerance, screw engagement and enclosure-side clearance</text>
<text x="560.0" y="644.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">• connector-to-holder depth clearance in the final enclosure stack</text>
<text x="560.0" y="690.0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#b42318">Dimensioned architecture projection — not a production enclosure drawing.</text>
<text x="560.0" y="716.0" font-family="sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#526076">All free text in this mechanical view is documentation annotation, not PCB silkscreen.</text>
</svg>
