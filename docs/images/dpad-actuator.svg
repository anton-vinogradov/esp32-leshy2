<rect x="1047.5" y="479.6" width="165.0" height="68.5" fill="#e2e8f0" stroke="#64748b" data-part="SKRHADE010-body"/>
<rect x="1097.0" y="363.0" width="66.0" height="116.5" fill="#f1f5f9" stroke="#475467" data-part="SKRHADE010-stem"/>
<path d="M930 385.2 H1051.9 V422.2 H930 Z M1208.1 385.2 H1330 V422.2 H1208.1 Z" fill="#ffedd5" stroke="#ea580c" data-part="panel-wall"/>
