<rect width="100%" height="100%" fill="#ffffff"/>
<text x="32.0" y="38.0" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#172033">Leshy2 — L2-DPAD-001-A controlled D-pad actuator</text>
<text x="32.0" y="64.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#526076">One custom PA12 cross, one Alps Alpine SKRHADE010 and one square panel guide; supplier MPN does not apply to the cross.</text>
