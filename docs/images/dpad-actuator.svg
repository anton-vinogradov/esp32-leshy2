<text x="50.0" y="124.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#172033">Front plan — user-facing</text>
<text x="480.0" y="124.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#172033">Underside — anti-rotation and retention</text>
<text x="910.0" y="124.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#172033">Section through one arm — PCB Z datum</text>
