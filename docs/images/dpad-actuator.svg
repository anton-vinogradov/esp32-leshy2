<line x1="920" y1="385.2" x2="920" y2="348.2" stroke="#344054" marker-start="url(#dim-arrow)" marker-end="url(#dim-arrow)"/>
<text x="910.0" y="370.7" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="end" fill="#172033">1.0</text>
<text x="910.0" y="494.0" font-family="sans-serif" font-size="9.5" font-weight="normal" text-anchor="start" fill="#526076">neutral cap/panel gap</text>
<text x="910.0" y="568.0" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="start" fill="#172033">Alps Alps Alpine SKRHADE010</text>
<text x="32.0" y="630.0" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#172033">Machine-checked motion budget</text>
<text x="32.0" y="660.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Directional tilt: 3.754° from 0.25-mm travel at Z=4.3 mm and the official Z=0.49-mm pivot.</text>
<text x="32.0" y="686.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Guide motion at the panel: 0.257 mm; worst-case lateral margin: 0.293 mm.</text>
<text x="32.0" y="712.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Cross-edge sweep: 0.459 mm; worst-case panel gap: 0.341 mm.</text>
<text x="32.0" y="738.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Centre travel: 0.15 mm; worst-case remaining panel gap: 0.650 mm.</text>
<text x="32.0" y="780.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#166534">H1 result</text>
<text x="132.0" y="780.0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#166534">dimensioned paper design complete</text>
<text x="32.0" y="808.0" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#b42318">H5 gate</text>
<text x="132.0" y="808.0" font-family="sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#b42318">received switch + PA12 tolerance coupon: fit, feel, retention, discrimination and endurance</text>
<text x="32.0" y="850.0" font-family="sans-serif" font-size="10.5" font-weight="normal" text-anchor="start" fill="#526076">Source: Alps Alpine SKRH Series Drawing No.4, Update 2510. This is a controlled product-design drawing, not an enclosure release.</text>
