<circle cx="665.0" cy="300.0" r="47.5" fill="#ffffff" stroke="#6d28d9" stroke-width="2" data-part="four-jaw-socket"/>
<circle cx="665.0" cy="300.0" r="27.6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
<rect x="659.3" y="250.5" width="11.4" height="99.0" fill="#ffffff"/>
<rect x="615.5" y="294.3" width="99.0" height="11.4" fill="#ffffff"/>
<circle cx="665.0" cy="300.0" r="27.6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="480.0" y="500.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Square guide: 5.6 mm; aperture clearance: 0.95 mm/side</text>
<text x="480.0" y="524.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Four-jaw socket: Ø2.9 bore / Ø5.0 body</text>
<text x="480.0" y="548.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Stem engagement: 2.0 mm; four 0.6-mm slots</text>
<text x="480.0" y="572.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#526076">Square guide carries anti-rotation; the round stem is not treated as keyed.</text>
<line x1="930" y1="548.0" x2="1330" y2="548.0" stroke="#16a34a" stroke-width="6" data-datum="PCB-Z0"/>
