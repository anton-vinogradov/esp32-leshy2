<text x="50.0" y="544.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#172033">Panel aperture: 7.5 × 7.5 mm</text>
<text x="50.0" y="568.0" font-family="sans-serif" font-size="11" font-weight="normal" text-anchor="start" fill="#526076">Cross remains aligned to UP/RIGHT/DOWN/LEFT legends.</text>
<polygon points="585.2,167.0 744.8,167.0 744.8,220.2 798.0,220.2 798.0,379.8 744.8,379.8 744.8,433.0 585.2,433.0 585.2,379.8 532.0,379.8 532.0,220.2 585.2,220.2" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.7"/>
