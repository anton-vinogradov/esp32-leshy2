<text x="100.0" y="690.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#92400e">T = 5 x 3 mm removable polyimide-tape saddle on a machine-checked clear landing</text>
<text x="760.0" y="145.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1d4ed8">DO NOT GUESS AN IPEX AXIS FOR THE THREE LONG PATHS</text>
<text x="760.0" y="180.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#172033">The Ebyte drawing puts IPEX in one corner but gives no centre dimension.</text>
<text x="760.0" y="205.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#172033">Dashed source windows enclose that entire published corner.</text>
<text x="760.0" y="230.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#172033">Length is checked from the farthest window point, not the drawn dot.</text>
<text x="760.0" y="275.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1d4ed8">ROUTE RESULT</text>
<circle cx="776" cy="303" r="6" fill="#0f766e"/>
<text x="795.0" y="308.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#0f766e">N24-0</text>
<text x="930.0" y="308.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#172033">60 mm cable</text>
<text x="1060.0" y="308.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#172033">route &lt;= 45.06 mm</text>
<text x="1240.0" y="308.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#166534">reserve 14.94 mm</text>
<circle cx="776" cy="341" r="6" fill="#2563eb"/>
<text x="795.0" y="346.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2563eb">S3-2G4</text>
<text x="930.0" y="346.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#172033">30 mm cable</text>
<text x="1060.0" y="346.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#172033">route &lt;= 15.28 mm</text>
<text x="1240.0" y="346.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#166534">reserve 14.72 mm</text>
<circle cx="776" cy="379" r="6" fill="#7c3aed"/>
<text x="795.0" y="384.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#7c3aed">N24-1</text>
<text x="930.0" y="384.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#172033">60 mm cable</text>
<text x="1060.0" y="384.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#172033">route &lt;= 49.52 mm</text>
<text x="1240.0" y="384.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#166534">reserve 10.48 mm</text>
<circle cx="776" cy="417" r="6" fill="#dc2626"/>
<text x="795.0" y="422.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#dc2626">C5-2G4/5</text>
<text x="930.0" y="422.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#172033">30 mm cable</text>
<text x="1060.0" y="422.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#172033">route &lt;= 20.87 mm</text>
<text x="1240.0" y="422.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#166534">reserve 9.13 mm</text>
<circle cx="776" cy="455" r="6" fill="#ea580c"/>
<text x="795.0" y="460.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#ea580c">N24-2</text>
<text x="930.0" y="460.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="start" fill="#172033">60 mm cable</text>
<text x="1060.0" y="460.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#172033">route &lt;= 42.46 mm</text>
<text x="1240.0" y="460.0" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#166534">reserve 17.54 mm</text>
<text x="760.0" y="525.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1d4ed8">ASSEMBLY / ACCESS</text>
<text x="775.0" y="560.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="775" cy="555" r="14" fill="#2563eb"/>
<text x="805.0" y="560.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#172033">Continuity-check and mate both ends vertically.</text>
<text x="775.0" y="603.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="775" cy="598" r="14" fill="#2563eb"/>
<text x="805.0" y="603.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#172033">Form a visible relaxed bow; never pull on a plug.</text>
<text x="775.0" y="646.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="775" cy="641" r="14" fill="#2563eb"/>
<text x="805.0" y="646.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#172033">Apply one removable saddle without flattening the cable.</text>
<text x="775.0" y="689.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="775" cy="684" r="14" fill="#2563eb"/>
<text x="805.0" y="689.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#172033">Inspect all 10 microcoax mates and 10 SMA solder windows.</text>
<text x="760.0" y="750.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#1d4ed8">ENCLOSURE RULE</text>
<text x="760.0" y="783.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#172033">No rib, stop, screw, adhesive or loose hardware enters a corridor</text>
<text x="760.0" y="808.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#172033">or its 6-mm connector inspection circle. The 11-mm sandwich</text>
<text x="760.0" y="833.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#172033">must close with no cable pressure; assembled STEP rechecks this in H6.0.6.</text>
<text x="70.0" y="876.0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#166534">audit: pass - five paths - five clear saddles - minimum relaxed reserve 9.13 mm - H6.0.2 routing may start</text>
