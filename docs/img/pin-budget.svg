<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 358" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#152220;font-size:16px;font-weight:700} .sub{fill:#5c6f6c;font-size:11.5px}
    .rowlbl{fill:#152220;font-size:13px;font-weight:700} .tick{fill:#8a9aa0;font-size:11px}
    .grid{stroke:#e1e0d9;stroke-width:1} .ceil{stroke:#c0392f;stroke-width:1.5;stroke-dasharray:4 3}
    .ceillbl{fill:#c0392f;font-size:11px;font-weight:700}
    .core{fill:#e6f1fb} .coret{fill:#0c447c;font-size:11px;font-weight:700}
    .rad{fill:#e1f5ee} .radt{fill:#0f6e56;font-size:11px;font-weight:700}
    .i2c{fill:#faeeda} .i2ct{fill:#854f0b;font-size:11px;font-weight:700}
    .hc{fill:#f1efe8} .hct{fill:#5f5e5a;font-size:11px;font-weight:700}
    .tot{font-size:12px;font-weight:700} .gtot{fill:#27500a} .otot{fill:#791f1f}
    .lg{fill:#5c6f6c;font-size:11.5px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1518} .title{fill:#e7eff0} .sub{fill:#90a6ab} .rowlbl{fill:#e7eff0} .tick{fill:#90a6ab} .lg{fill:#90a6ab}
      .grid{stroke:#2c2c2a} .ceil{stroke:#e46a60} .ceillbl{fill:#e46a60}
      .core{fill:#042c53} .coret{fill:#b5d4f4} .rad{fill:#04342c} .radt{fill:#5dcaa5}
      .i2c{fill:#412402} .i2ct{fill:#fac775} .hc{fill:#2c2c2a} .hct{fill:#b4b2a9}
      .gtot{fill:#c0dd97} .otot{fill:#f7c1c1}
    }
  </style>
  <rect class="bg" x="0" y="0" width="820" height="358"/>
  <text class="title" x="20" y="34">Leshy2 — GPIO budget, stacked by tier</text>
  <text class="sub" x="20" y="54">One mode at a time; peak mode = LoRa+GPS. Core can't be cut; I²C and 74HC138 are options.</text>
  <text class="sub" x="20" y="72">Core = encoder + SPI bus + SD-CS + display. Radios = per-mode peak pool. I²C = Si4732/RFID2/Grove bus.</text>
  <line class="grid" x1="140" y1="122" x2="140" y2="266"/><text class="tick" x="140" y="116" text-anchor="middle">0</text><line class="grid" x1="290" y1="122" x2="290" y2="266"/><text class="tick" x="290" y="116" text-anchor="middle">5</text><line class="grid" x1="440" y1="122" x2="440" y2="266"/><text class="tick" x="440" y="116" text-anchor="middle">10</text><line class="grid" x1="590" y1="122" x2="590" y2="266"/><text class="tick" x="590" y="116" text-anchor="middle">15</text><line class="grid" x1="710" y1="122" x2="710" y2="266"/><text class="tick" x="710" y="116" text-anchor="middle">19</text><line class="grid" x1="740" y1="122" x2="740" y2="266"/><text class="tick" x="740" y="116" text-anchor="middle">20</text>
  <line class="ceil" x1="710" y1="122" x2="710" y2="266"/><text class="ceillbl" x="710" y="284" text-anchor="middle">ceiling 19</text>
  <text class="rowlbl" x="128" y="159.0" text-anchor="end">SPI display</text><rect class="core" x="140" y="132" width="240" height="46" rx="3"/><text class="coret" x="260.0" y="153.0" text-anchor="middle">Always</text><text class="coret" x="260.0" y="167.0" text-anchor="middle" font-size="10">+8</text><rect class="rad" x="380" y="132" width="150" height="46" rx="3"/><text class="radt" x="455.0" y="153.0" text-anchor="middle">Radio</text><text class="radt" x="455.0" y="167.0" text-anchor="middle" font-size="10">+5</text><rect class="i2c" x="530" y="132" width="60" height="46" rx="3"/><text class="i2ct" x="560.0" y="153.0" text-anchor="middle">I2C</text><text class="i2ct" x="560.0" y="167.0" text-anchor="middle" font-size="10">+2</text><rect class="hc" x="590" y="132" width="30" height="46" rx="3"/><text class="hct" x="605.0" y="153.0" text-anchor="middle">138</text><text class="hct" x="605.0" y="167.0" text-anchor="middle" font-size="10">+1</text><text class="tot gtot" x="628" y="159.0">16/19 (fits)</text><text class="rowlbl" x="128" y="237.0" text-anchor="end">QSPI display</text><rect class="core" x="140" y="210" width="360" height="46" rx="3"/><text class="coret" x="320.0" y="231.0" text-anchor="middle">Always</text><text class="coret" x="320.0" y="245.0" text-anchor="middle" font-size="10">+12</text><rect class="rad" x="500" y="210" width="150" height="46" rx="3"/><text class="radt" x="575.0" y="231.0" text-anchor="middle">Radio</text><text class="radt" x="575.0" y="245.0" text-anchor="middle" font-size="10">+5</text><rect class="i2c" x="650" y="210" width="60" height="46" rx="3"/><text class="i2ct" x="680.0" y="231.0" text-anchor="middle">I2C</text><text class="i2ct" x="680.0" y="245.0" text-anchor="middle" font-size="10">+2</text><rect class="hc" x="710" y="210" width="30" height="46" rx="3"/><text class="hct" x="725.0" y="231.0" text-anchor="middle">138</text><text class="hct" x="725.0" y="245.0" text-anchor="middle" font-size="10">+1</text><text class="tot otot" x="748" y="237.0">20/19 (over 1)</text>
  <g>
    <rect class="core" x="20" y="318" width="12" height="12" rx="2"/><text class="lg" x="38" y="328">always used</text>
    <rect class="rad" x="86" y="318" width="12" height="12" rx="2"/><text class="lg" x="104" y="328">radio (reserved)</text>
    <rect class="i2c" x="176" y="318" width="12" height="12" rx="2"/><text class="lg" x="194" y="328">I²C option</text>
    <rect class="hc" x="288" y="318" width="12" height="12" rx="2"/><text class="lg" x="306" y="328">74HC138 option</text>
  </g>
</svg>
