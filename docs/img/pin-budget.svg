<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 604" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <style>
    .bg{fill:#ffffff}
    .zebra{fill:#f5f7f8}
    .title{fill:#152220;font-size:16px;font-weight:700}
    .sub{fill:#5c6f6c;font-size:11.5px}
    .hd{fill:#5c6f6c;font-size:11px;font-weight:700;letter-spacing:.04em}
    .nm{fill:#152220;font-size:12.5px}
    .acc{fill:#e6f1fb;stroke:#85b7eb;stroke-width:1} .acct{fill:#0c447c;font-size:11px}
    .free{fill:none;stroke:#d7e0dd;stroke-width:1;stroke-dasharray:4 3}
    .ok{fill:#eaf3de} .okt{fill:#27500a;font-size:12px;font-weight:700}
    .warn{fill:#faeeda} .warnt{fill:#633806;font-size:12px;font-weight:700}
    .over{fill:#fcebeb} .overt{fill:#791f1f;font-size:12px;font-weight:700}
    .lg{fill:#5c6f6c;font-size:11.5px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1518} .zebra{fill:#141f24}
      .title{fill:#e7eff0} .sub{fill:#90a6ab} .hd{fill:#90a6ab} .nm{fill:#e7eff0} .lg{fill:#90a6ab}
      .acc{fill:#042c53;stroke:#185fa5} .acct{fill:#b5d4f4}
      .free{stroke:#33505a}
      .ok{fill:#173404} .okt{fill:#c0dd97}
      .warn{fill:#412402} .warnt{fill:#fac775}
      .over{fill:#501313} .overt{fill:#f7c1c1}
    }
  </style>
  <rect class="bg" x="0" y="0" width="818" height="604"/>
  <text class="title" x="24" y="34">Leshy2 — GPIO budget by usage mode</text>
  <text class="sub" x="24" y="54">One radio mode at a time — radios share a pool, so the peak is the heaviest single mode, not the sum.</text>
  <text class="sub" x="24" y="72">Base 11 pins always (SPI x3, 74HC138 x3, I2C x2, encoder x2, WS2812 x1) + display (SPI +1 / QSPI +5) + mode pool.</text>
  <text class="sub" x="24" y="90">Ceiling: 19 usable GPIO on ESP32-C5 (after flash/PSRAM + USB).</text>
  <text class="hd" x="28" y="98">Mode</text>
  <text class="hd" x="244" y="98">mode pool (4 shared GPIO)</text>
  <text class="hd" x="646.0" y="98" text-anchor="middle">SPI</text>
  <text class="hd" x="748.0" y="98" text-anchor="middle">QSPI</text>
  <rect class="zebra" x="24" y="112" width="770" height="40" rx="5"/>
  <text class="nm" x="32" y="136.0">Menu / idle</text>
  <rect class="free" x="245" y="119" width="80" height="26" rx="5"/>
  <rect class="free" x="331" y="119" width="80" height="26" rx="5"/>
  <rect class="free" x="417" y="119" width="80" height="26" rx="5"/>
  <rect class="free" x="503" y="119" width="80" height="26" rx="5"/>
  <rect class="ok" x="600" y="118" width="92" height="28" rx="6"/>
  <text class="okt" x="646.0" y="137.0" text-anchor="middle">12 / 19</text>
  <rect class="ok" x="702" y="118" width="92" height="28" rx="6"/>
  <text class="okt" x="748.0" y="137.0" text-anchor="middle">16 / 19</text>
  <text class="nm" x="32" y="176.0">WiFi 2.4/5</text>
  <rect class="free" x="245" y="159" width="80" height="26" rx="5"/>
  <rect class="free" x="331" y="159" width="80" height="26" rx="5"/>
  <rect class="free" x="417" y="159" width="80" height="26" rx="5"/>
  <rect class="free" x="503" y="159" width="80" height="26" rx="5"/>
  <rect class="ok" x="600" y="158" width="92" height="28" rx="6"/>
  <text class="okt" x="646.0" y="177.0" text-anchor="middle">12 / 19</text>
  <rect class="ok" x="702" y="158" width="92" height="28" rx="6"/>
  <text class="okt" x="748.0" y="177.0" text-anchor="middle">16 / 19</text>
