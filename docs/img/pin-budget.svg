<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 384" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#152220;font-size:16px;font-weight:700} .sub{fill:#5c6f6c;font-size:11.5px}
    .rowlbl{fill:#152220;font-size:13px;font-weight:700} .tick{fill:#8a9aa0;font-size:11px}
    .grid{stroke:#e1e0d9;stroke-width:1} .ceil{stroke:#c0392f;stroke-width:1.5;stroke-dasharray:4 3}
    .ceillbl{fill:#c0392f;font-size:11px;font-weight:700}
    .core{fill:#e6f1fb} .coret{fill:#0c447c;font-size:11px;font-weight:700}
    .rad{fill:#fbe9e2} .radt{fill:#9a3a1c;font-size:11px;font-weight:700}
    .i2c{fill:#faeeda} .i2ct{fill:#854f0b;font-size:11px;font-weight:700}
    .boot{fill:#efe3f5} .boott{fill:#5b2a7a;font-size:11px;font-weight:700}
    .tot{font-size:12px;font-weight:700} .gtot{fill:#27500a} .otot{fill:#791f1f}
    .lg{fill:#5c6f6c;font-size:11.5px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1518} .title{fill:#e7eff0} .sub{fill:#90a6ab} .rowlbl{fill:#e7eff0} .tick{fill:#90a6ab} .lg{fill:#90a6ab}
      .grid{stroke:#2c2c2a} .ceil{stroke:#e46a60} .ceillbl{fill:#e46a60}
      .core{fill:#042c53} .coret{fill:#b5d4f4} .rad{fill:#3d1a0c} .radt{fill:#f0a583}
      .i2c{fill:#412402} .i2ct{fill:#fac775}
      .boot{fill:#2e1740} .boott{fill:#d3aef0}
      .gtot{fill:#c0dd97} .otot{fill:#f7c1c1}
    }
  </style>
  <rect class="bg" x="0" y="0" width="930" height="384"/>
  <text class="title" x="20" y="34">Leshy2 — GPIO budget, direct pins by tier</text>
  <text class="sub" x="20" y="54">Per-chip radio lines SUM (each goes to a different chip — not a reusable pool). Slow controls ride a PCA9555 (I²C, 0 GPIO).</text>
  <text class="sub" x="20" y="72">Core = SPI/I²C/UART buses + 74HC138 + encoder A/B. Chosen: ST7796 over SPI. 19 signals + BOOT = 20/20, no spare (DIO1 &amp; nRF24-IRQ polled).</text>
  <line class="grid" x1="185" y1="140" x2="185" y2="286"/><text class="tick" x="185" y="134" text-anchor="middle">0</text><line class="grid" x1="310" y1="140" x2="310" y2="286"/><text class="tick" x="310" y="134" text-anchor="middle">5</text><line class="grid" x1="435" y1="140" x2="435" y2="286"/><text class="tick" x="435" y="134" text-anchor="middle">10</text><line class="grid" x1="560" y1="140" x2="560" y2="286"/><text class="tick" x="560" y="134" text-anchor="middle">15</text><line class="grid" x1="685" y1="140" x2="685" y2="286"/><text class="tick" x="685" y="134" text-anchor="middle">20</text>
  <line class="ceil" x1="685" y1="140" x2="685" y2="286"/><text class="ceillbl" x="685" y="304" text-anchor="middle">ceiling ~20</text>
  <text class="rowlbl" x="173" y="177.0" text-anchor="end">ST7796 / SPI</text><rect class="core" x="185" y="150" width="300" height="46" rx="3"/><text class="coret" x="335.0" y="171.0" text-anchor="middle">Core</text><text class="coret" x="335.0" y="185.0" text-anchor="middle" font-size="10">+12</text><rect class="rad" x="485" y="150" width="150" height="46" rx="3"/><text class="radt" x="560.0" y="171.0" text-anchor="middle">Radio lines</text><text class="radt" x="560.0" y="185.0" text-anchor="middle" font-size="10">+6</text><rect class="i2c" x="635" y="150" width="25" height="46" rx="3"/><text class="i2ct" x="647.5" y="177.0" text-anchor="middle" font-size="10">1</text><rect class="boot" x="660" y="150" width="25" height="46" rx="3"/><text class="boott" x="672.5" y="177.0" text-anchor="middle" font-size="10">1</text><text class="tot gtot" x="695" y="177.0">20/20 (fits)</text><text class="rowlbl" x="173" y="257.0" text-anchor="end">any / QSPI</text><rect class="core" x="185" y="230" width="300" height="46" rx="3"/><text class="coret" x="335.0" y="251.0" text-anchor="middle">Core</text><text class="coret" x="335.0" y="265.0" text-anchor="middle" font-size="10">+12</text><rect class="rad" x="485" y="230" width="150" height="46" rx="3"/><text class="radt" x="560.0" y="251.0" text-anchor="middle">Radio lines</text><text class="radt" x="560.0" y="265.0" text-anchor="middle" font-size="10">+6</text><rect class="i2c" x="635" y="230" width="125" height="46" rx="3"/><text class="i2ct" x="697.5" y="251.0" text-anchor="middle">Disp</text><text class="i2ct" x="697.5" y="265.0" text-anchor="middle" font-size="10">+5</text><rect class="boot" x="760" y="230" width="25" height="46" rx="3"/><text class="boott" x="772.5" y="257.0" text-anchor="middle" font-size="10">1</text><text class="tot otot" x="795" y="257.0">24/20 (over 4)</text>
  <g>
    <rect class="core" x="20" y="344" width="12" height="12" rx="2"/><text class="lg" x="38" y="354">core (buses + 138 + enc A/B)</text>
    <rect class="rad" x="250" y="344" width="12" height="12" rx="2"/><text class="lg" x="268" y="354">per-chip radio lines (sum)</text>
    <rect class="i2c" x="470" y="344" width="12" height="12" rx="2"/><text class="lg" x="488" y="354">display</text>
  </g>
</svg>
