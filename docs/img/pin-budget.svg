  <text class="nm" x="32" y="416.0">Listen HF/FM</text>
  <rect class="free" x="245" y="399" width="80" height="26" rx="5"/>
  <rect class="free" x="331" y="399" width="80" height="26" rx="5"/>
  <rect class="free" x="417" y="399" width="80" height="26" rx="5"/>
  <rect class="free" x="503" y="399" width="80" height="26" rx="5"/>
  <rect class="ok" x="600" y="398" width="92" height="28" rx="6"/>
  <text class="okt" x="646.0" y="417.0" text-anchor="middle">12 / 19</text>
  <rect class="ok" x="702" y="398" width="92" height="28" rx="6"/>
  <text class="okt" x="748.0" y="417.0" text-anchor="middle">16 / 19</text>
  <rect class="zebra" x="24" y="432" width="770" height="40" rx="5"/>
  <text class="nm" x="32" y="456.0">Keys (RFID2)</text>
  <rect class="free" x="245" y="439" width="80" height="26" rx="5"/>
  <rect class="free" x="331" y="439" width="80" height="26" rx="5"/>
  <rect class="free" x="417" y="439" width="80" height="26" rx="5"/>
  <rect class="free" x="503" y="439" width="80" height="26" rx="5"/>
  <rect class="ok" x="600" y="438" width="92" height="28" rx="6"/>
  <text class="okt" x="646.0" y="457.0" text-anchor="middle">12 / 19</text>
  <rect class="ok" x="702" y="438" width="92" height="28" rx="6"/>
  <text class="okt" x="748.0" y="457.0" text-anchor="middle">16 / 19</text>
  <text class="nm" x="32" y="496.0">IR remotes</text>
  <rect class="free" x="245" y="479" width="80" height="26" rx="5"/>
  <rect class="free" x="331" y="479" width="80" height="26" rx="5"/>
  <rect class="free" x="417" y="479" width="80" height="26" rx="5"/>
  <rect class="free" x="503" y="479" width="80" height="26" rx="5"/>
  <rect class="ok" x="600" y="478" width="92" height="28" rx="6"/>
