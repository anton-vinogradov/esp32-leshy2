  <rect class="acc" x="331" y="239" width="80" height="26" rx="5"/>
  <text class="acct" x="371.0" y="256.0" text-anchor="middle">CE2</text>
  <rect class="acc" x="417" y="239" width="80" height="26" rx="5"/>
  <text class="acct" x="457.0" y="256.0" text-anchor="middle">CE3</text>
  <rect class="free" x="503" y="239" width="80" height="26" rx="5"/>
  <rect class="ok" x="600" y="238" width="92" height="28" rx="6"/>
