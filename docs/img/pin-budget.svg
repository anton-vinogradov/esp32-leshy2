  <rect class="ok" x="600" y="278" width="92" height="28" rx="6"/>
  <text class="okt" x="646.0" y="297.0" text-anchor="middle">14 / 19</text>
  <rect class="warn" x="702" y="278" width="92" height="28" rx="6"/>
