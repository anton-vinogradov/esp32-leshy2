<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 620" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <style>
    .bg{fill:#ffffff} .zebra{fill:#f5f7f8}
    .title{fill:#152220;font-size:16px;font-weight:700} .sub{fill:#5c6f6c;font-size:11.5px}
    .hd{fill:#5c6f6c;font-size:11px;font-weight:700;letter-spacing:.04em} .nm{fill:#152220;font-size:12.5px}
    .acc{fill:#e6f1fb;stroke:#85b7eb;stroke-width:1} .acct{fill:#0c447c;font-size:11px}
    .free{fill:none;stroke:#d7e0dd;stroke-width:1;stroke-dasharray:4 3}
    .ok{fill:#eaf3de} .okt{fill:#27500a;font-size:12px;font-weight:700}
    .warn{fill:#faeeda} .warnt{fill:#633806;font-size:12px;font-weight:700}
    .over{fill:#fcebeb} .overt{fill:#791f1f;font-size:12px;font-weight:700}
    .lg{fill:#5c6f6c;font-size:11.5px}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1518} .zebra{fill:#141f24}
      .title{fill:#e7eff0} .sub{fill:#90a6ab} .hd{fill:#90a6ab} .nm{fill:#e7eff0} .lg{fill:#90a6ab}
      .acc{fill:#042c53;stroke:#185fa5} .acct{fill:#b5d4f4} .free{stroke:#33505a}
      .ok{fill:#173404} .okt{fill:#c0dd97} .warn{fill:#412402} .warnt{fill:#fac775} .over{fill:#501313} .overt{fill:#f7c1c1}
    }
  </style>
  <rect class="bg" x="0" y="0" width="808" height="620"/>
  <text class="title" x="24" y="34">Leshy2 — GPIO budget by usage mode (no hub)</text>
  <text class="sub" x="24" y="54">One radio mode at a time — radios share a pool, so the peak is the heaviest single mode, not the sum.</text>
  <text class="sub" x="24" y="72">Common 12 always: encoder A/B/SW x3, WS2812 x1, SPI bus x3, 74HC138 CS x3, I2C x2.</text>
  <text class="sub" x="24" y="90">Display: 1-bit SPI +1 / QSPI +5. Mode pool: reused GPIO, only the peak counts.</text>
  <text class="sub" x="24" y="108">Ceiling: 19 usable GPIO on ESP32-C5. Peak = LoRa+GPS. SPI fits; QSPI overflows.</text>
  <text class="hd" x="28" y="114">Mode</text>
  <text class="hd" x="234" y="114">mode pool (reused GPIO)</text>
  <text class="hd" x="636.0" y="114" text-anchor="middle">SPI</text>
  <text class="hd" x="738.0" y="114" text-anchor="middle">QSPI</text>
  <rect class="zebra" x="24" y="128" width="760" height="40" rx="5"/>
  <text class="nm" x="32" y="152.0">Menu / idle</text>
  <rect class="free" x="235" y="135" width="80" height="26" rx="5"/>
  <rect class="free" x="321" y="135" width="80" height="26" rx="5"/>
  <rect class="free" x="407" y="135" width="80" height="26" rx="5"/>
  <rect class="free" x="493" y="135" width="80" height="26" rx="5"/>
  <rect class="ok" x="590" y="134" width="92" height="28" rx="6"/>
  <text class="okt" x="636.0" y="153.0" text-anchor="middle">13 / 19</text>
  <rect class="ok" x="692" y="134" width="92" height="28" rx="6"/>
  <text class="okt" x="738.0" y="153.0" text-anchor="middle">17 / 19</text>
  <text class="nm" x="32" y="192.0">WiFi 2.4/5</text>
  <rect class="free" x="235" y="175" width="80" height="26" rx="5"/>
  <rect class="free" x="321" y="175" width="80" height="26" rx="5"/>
  <rect class="free" x="407" y="175" width="80" height="26" rx="5"/>
  <rect class="free" x="493" y="175" width="80" height="26" rx="5"/>
  <rect class="ok" x="590" y="174" width="92" height="28" rx="6"/>
