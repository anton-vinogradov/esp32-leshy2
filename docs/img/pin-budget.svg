  <text class="nm" x="32" y="336.0">Walkie (SA868)</text>
  <rect class="acc" x="245" y="319" width="80" height="26" rx="5"/>
  <text class="acct" x="285.0" y="336.0" text-anchor="middle">TX</text>
  <rect class="acc" x="331" y="319" width="80" height="26" rx="5"/>
  <text class="acct" x="371.0" y="336.0" text-anchor="middle">RX</text>
  <rect class="free" x="417" y="319" width="80" height="26" rx="5"/>
  <rect class="free" x="503" y="319" width="80" height="26" rx="5"/>
