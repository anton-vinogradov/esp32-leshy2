  <text class="warnt" x="738.0" y="433.0" text-anchor="middle">18 / 19</text>
  <rect class="zebra" x="24" y="448" width="760" height="40" rx="5"/>
  <text class="nm" x="32" y="472.0">Keys (RFID2)</text>
  <rect class="free" x="235" y="455" width="80" height="26" rx="5"/>
  <rect class="free" x="321" y="455" width="80" height="26" rx="5"/>
  <rect class="free" x="407" y="455" width="80" height="26" rx="5"/>
  <rect class="free" x="493" y="455" width="80" height="26" rx="5"/>
  <rect class="ok" x="590" y="454" width="92" height="28" rx="6"/>
