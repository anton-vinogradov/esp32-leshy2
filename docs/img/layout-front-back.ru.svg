<svg viewBox="0 0 640 600" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="640" height="580" fill="#f5f7fa"/>
  <text x="320" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Leshy2 — перёд и зад (в масштабе, 80 × 170 мм)</text>

  <!-- ============ FRONT ============ -->
  <text x="165" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">ПЕРЁД</text>
  <rect x="65" y="66" width="200" height="425" rx="20" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <!-- antennas -->
  <text x="165" y="94" text-anchor="middle" font-size="8" font-weight="600" fill="#334155">▲ 9 SMA (съёмные) — nRF (синие) разнесены ▲</text>
  <g><line x1="82" y1="78" x2="82" y2="70" stroke="#1d4ed8" stroke-width="1.6"/><circle cx="82" cy="70" r="1.8" fill="#1d4ed8"/><circle cx="82" cy="82" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="1.6"/><circle cx="82" cy="82" r="1.5" fill="#1d4ed8"/><line x1="103" y1="78" x2="103" y2="70" stroke="#dc2626" stroke-width="1.6"/><circle cx="103" cy="70" r="1.8" fill="#dc2626"/><circle cx="103" cy="82" r="4" fill="#fff" stroke="#dc2626" stroke-width="1.6"/><circle cx="103" cy="82" r="1.5" fill="#dc2626"/><line x1="124" y1="78" x2="124" y2="70" stroke="#15803d" stroke-width="1.6"/><circle cx="124" cy="70" r="1.8" fill="#15803d"/><circle cx="124" cy="82" r="4" fill="#fff" stroke="#15803d" stroke-width="1.6"/><circle cx="124" cy="82" r="1.5" fill="#15803d"/><line x1="145" y1="78" x2="145" y2="70" stroke="#b45309" stroke-width="1.6"/><circle cx="145" cy="70" r="1.8" fill="#b45309"/><circle cx="145" cy="82" r="4" fill="#fff" stroke="#b45309" stroke-width="1.6"/><circle cx="145" cy="82" r="1.5" fill="#b45309"/><line x1="165" y1="78" x2="165" y2="70" stroke="#1d4ed8" stroke-width="1.6"/><circle cx="165" cy="70" r="1.8" fill="#1d4ed8"/><circle cx="165" cy="82" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="1.6"/><circle cx="165" cy="82" r="1.5" fill="#1d4ed8"/><line x1="185" y1="78" x2="185" y2="70" stroke="#0e7490" stroke-width="1.6"/><circle cx="185" cy="70" r="1.8" fill="#0e7490"/><circle cx="185" cy="82" r="4" fill="#fff" stroke="#0e7490" stroke-width="1.6"/><circle cx="185" cy="82" r="1.5" fill="#0e7490"/><line x1="206" y1="78" x2="206" y2="70" stroke="#1d4ed8" stroke-width="1.6"/><circle cx="206" cy="70" r="1.8" fill="#1d4ed8"/><circle cx="206" cy="82" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="1.6"/><circle cx="206" cy="82" r="1.5" fill="#1d4ed8"/><line x1="227" y1="78" x2="227" y2="70" stroke="#7c3aed" stroke-width="1.6"/><circle cx="227" cy="70" r="1.8" fill="#7c3aed"/><circle cx="227" cy="82" r="4" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/><circle cx="227" cy="82" r="1.5" fill="#7c3aed"/><line x1="248" y1="78" x2="248" y2="70" stroke="#1d4ed8" stroke-width="1.6"/><circle cx="248" cy="70" r="1.8" fill="#1d4ed8"/><circle cx="248" cy="82" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="1.6"/><circle cx="248" cy="82" r="1.5" fill="#1d4ed8"/></g>
  <!-- display 62x92mm = 155x230 -->
  <rect x="88" y="98" width="155" height="230" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.4"/>
  <rect x="95" y="108" width="141" height="210" rx="3" fill="#0b1220"/>
  <text x="165" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#7dd3fc">Дисплей 4.0″ · тач</text>
  <text x="165" y="223" text-anchor="middle" font-size="10" fill="#94a3b8">320×480 · 2:3</text>
  <circle cx="101" cy="119" r="3" fill="#22c55e"/>
  <!-- D-pad -->
  <rect x="146" y="352" width="38" height="78" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.3"/>
  <rect x="126" y="372" width="78" height="38" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="1.3"/>
  <circle cx="165" cy="391" r="15" fill="#cbd5e1" stroke="#334155" stroke-width="1.3"/><text x="165" y="395" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">OK</text>
  <text x="165" y="367" text-anchor="middle" font-size="8" fill="#475569">▲</text><text x="165" y="424" text-anchor="middle" font-size="8" fill="#475569">▼</text>
  <text x="137" y="395" text-anchor="middle" font-size="8" fill="#475569">◀</text><text x="193" y="395" text-anchor="middle" font-size="8" fill="#475569">▶</text>
  <text x="165" y="447" text-anchor="middle" font-size="8" font-weight="700" fill="#0f172a">D-pad</text>
  <!-- BACK / OPTIONS -->
  <circle cx="100" cy="391" r="15" fill="#fff" stroke="#334155" stroke-width="1.4"/><text x="100" y="389" text-anchor="middle" font-size="9" fill="#334155">↩</text><text x="100" y="401" text-anchor="middle" font-size="6.5" font-weight="700" fill="#0f172a">BACK</text>
  <circle cx="230" cy="391" r="15" fill="#fff" stroke="#334155" stroke-width="1.4"/><text x="230" y="388" text-anchor="middle" font-size="9" fill="#334155">☰</text><text x="230" y="401" text-anchor="middle" font-size="5" font-weight="700" fill="#0f172a">OPTIONS</text>
  <!-- edge buttons as tabs -->
  <rect x="57" y="106" width="10" height="26" rx="2" fill="#1e293b" stroke="#334155"/><text x="45" y="119" text-anchor="middle" font-size="7" font-weight="600" fill="#475569" transform="rotate(-90 45 119)">ИК TX/RX</text>
  <rect x="57" y="150" width="10" height="26" rx="3" fill="#f1f5f9" stroke="#334155"/><text x="46" y="167" text-anchor="middle" font-size="8" fill="#475569" transform="rotate(-90 46 167)">энкодер</text>
  <rect x="57" y="200" width="10" height="20" rx="3" fill="#f1f5f9" stroke="#334155"/><text x="49" y="211" text-anchor="middle" font-size="8" fill="#334155">F1</text>
  <rect x="57" y="230" width="10" height="20" rx="3" fill="#f1f5f9" stroke="#334155"/><text x="49" y="241" text-anchor="middle" font-size="8" fill="#334155">F2</text>
  <rect x="57" y="262" width="10" height="20" rx="5" fill="#ede9fe" stroke="#7c3aed"/><text x="46" y="272" text-anchor="middle" font-size="7" fill="#5b21b6" transform="rotate(-90 46 272)">3.5мм</text>
  <rect x="263" y="160" width="10" height="24" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="284" y="172" text-anchor="middle" font-size="8" font-weight="700" fill="#1d4ed8">PTT</text>
  <rect x="263" y="200" width="10" height="24" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/><text x="286" y="212" text-anchor="middle" font-size="8" font-weight="800" fill="#dc2626">STOP</text>
  <rect x="263" y="252" width="10" height="18" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="285" y="263" text-anchor="middle" font-size="6.5" font-weight="700" fill="#166534">Grove</text>
  <rect x="263" y="280" width="10" height="18" rx="3" fill="#dcfce7" stroke="#16a34a"/><text x="285" y="291" text-anchor="middle" font-size="6.5" font-weight="700" fill="#166534">Grove</text>
  <!-- front external: speaker, mic, IR -->
  <g fill="#94a3b8"><circle cx="92" cy="456" r="1.5"/><circle cx="98" cy="456" r="1.5"/><circle cx="104" cy="456" r="1.5"/><circle cx="92" cy="461" r="1.5"/><circle cx="98" cy="461" r="1.5"/><circle cx="104" cy="461" r="1.5"/></g><text x="98" y="472" text-anchor="middle" font-size="6" fill="#475569">динамик</text>
  <circle cx="165" cy="459" r="2.5" fill="#475569"/><text x="165" y="472" text-anchor="middle" font-size="6" fill="#475569">микрофон</text>
  <text x="165" y="485" text-anchor="middle" font-size="7.5" fill="#94a3b8">I/O-разъёмы — снизу, на изнанке ▽</text>

  <!-- ============ BACK ============ -->
  <text x="475" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">ЗАД (изнанка)</text>
  <rect x="375" y="66" width="200" height="425" rx="20" fill="#fbfaf8" stroke="#0f172a" stroke-width="2.5"/>
  <text x="475" y="84" text-anchor="middle" font-size="8" font-weight="600" fill="#334155">▲ антенны (общий верх) ▲</text>
  <!-- 2x 18650 vertical (18.5x65mm = 46x162) -->
  <rect x="423" y="104" width="46" height="162" rx="22" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
  <rect x="481" y="104" width="46" height="162" rx="22" fill="#fde68a" stroke="#b45309" stroke-width="1.6"/>
  <text x="446" y="188" text-anchor="middle" font-size="9" font-weight="700" fill="#7c2d12" transform="rotate(-90 446 188)">18650</text>
  <text x="504" y="188" text-anchor="middle" font-size="9" font-weight="700" fill="#7c2d12" transform="rotate(-90 504 188)">18650</text>
  <text x="475" y="286" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">2S 18650 · пластик. холдер (2 эл.)</text>
  <!-- decaps + RF modules region -->
  <g fill="#94a3b8"><rect x="392" y="310" width="8" height="7"/><rect x="406" y="310" width="8" height="7"/><rect x="392" y="324" width="8" height="7"/><rect x="540" y="310" width="8" height="7"/><rect x="554" y="310" width="8" height="7"/></g>
  <text x="475" y="330" text-anchor="middle" font-size="9" fill="#475569">децэпы + мелочь (на изнанке)</text>
  <!-- bottom I/O on back, facing down: USB USB SD | switch RESET BOOT -->
  <rect x="386" y="452" width="20" height="22" rx="3" fill="#334155"/>
  <rect x="410" y="452" width="20" height="22" rx="3" fill="#334155"/>
  <rect x="432" y="451" width="28" height="24" rx="2" fill="#cbd5e1" stroke="#334155"/>
  <rect x="478" y="452" width="22" height="22" rx="6" fill="#94a3b8" stroke="#334155"/>
  <rect x="506" y="456" width="12" height="18" rx="2" fill="#e2e8f0" stroke="#334155"/>
  <rect x="522" y="456" width="12" height="18" rx="2" fill="#e2e8f0" stroke="#334155"/>
  <text x="396" y="446" text-anchor="middle" font-size="7" fill="#475569">USB</text>
  <text x="420" y="446" text-anchor="middle" font-size="7" fill="#475569">USB</text>
  <text x="446" y="446" text-anchor="middle" font-size="7" fill="#475569">SD</text>
  <text x="489" y="446" text-anchor="middle" font-size="7" fill="#475569">⏻</text>
  <text x="512" y="446" text-anchor="middle" font-size="6" fill="#475569">RST</text>
  <text x="528" y="446" text-anchor="middle" font-size="5.5" fill="#475569">BOOT</text>
  <g stroke="#dc2626" stroke-width="1.6" fill="none">
    <path d="M396 478 L396 491"/><path d="M392 487 L396 492 L400 487"/>
    <path d="M420 478 L420 491"/><path d="M416 487 L420 492 L424 487"/>
    <path d="M446 479 L446 491"/><path d="M442 487 L446 492 L450 487"/>
    <path d="M489 478 L489 491"/><path d="M485 487 L489 492 L493 487"/>
  </g>
  <text x="475" y="486" text-anchor="middle" font-size="7.5" font-weight="700" fill="#dc2626">↓ вниз: USB×2 · SD · тумблер · RESET · BOOT ↓</text>

  <text x="320" y="516" text-anchor="middle" font-size="10" fill="#475569">Перёд: экран · D-pad / BACK / OPTIONS · динамик + микрофон.</text>
  <text x="320" y="533" text-anchor="middle" font-size="10" fill="#475569">Лево: энкодер / F1 / F2 + 3.5 мм-джек · ИК слева-сверху.</text>
  <text x="320" y="550" text-anchor="middle" font-size="10" fill="#475569">Право: PTT / STOP + Grove×2.</text>
  <text x="320" y="567" text-anchor="middle" font-size="10" fill="#475569">Зад: 2×18650 + децэпы · снизу вниз — USB×2 · microSD · тумблер · RESET · BOOT.</text>
</svg>
